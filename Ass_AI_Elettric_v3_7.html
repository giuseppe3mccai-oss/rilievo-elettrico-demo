.reference?.type==='image'?`<div class="banner">Foto pronta. ${r.geometry.points.length>=3?'Perimetro presente: calibra usando una misura nota.':'Tocca «Inizia conversione», poi i vertici direttamente sulla fotografia.'}</div>`:'<div class="banner">Carica prima una foto nel riquadro «Importazione planimetria — foto o PDF» qui sopra.</div>'}<p class="hint">Se la foto mostra più stanze, seleziona prima la scheda della stanza da lavorare. Il riconoscimento automatico multiplo e la lettura ottica delle quote richiedono un modulo successivo.</p>`)}${card('Disegna e modifica la stanza',`<div class="banner"><b>Parti dal foglio bianco:</b> scegli una forma iniziale, poi usa <b>Seleziona parete / arco</b>. Per pareti irregolari usa <b>Vertici a tocchi</b> e <b>Chiudi perimetro</b>. Per spostare gli angoli scegli <b>Sposta angoli</b>. Non occorre disegnare tutto da capo per creare un arco.</div><div class="drawingtools"><button class="tool" data-act="preset" data-type="rettangolo">4 pareti</button><button class="tool" data-act="preset" data-type="pentagono">5 pareti</button><button class="tool" data-act="preset" data-type="L">6 pareti / L</button><button class="tool" data-act="preset" data-type="esagono">6 pareti</button><button class="tool" data-act="preset" data-type="tonda">Tonda</button><button class="tool" data-act="emptyshape">▢ Foglio vuoto</button></div><div class="drawingtools"><button class="tool ${mode==='arc'?'active':''}" data-act="arcmode">◠ Seleziona parete / arco</button><button class="tool ${mode==='vertices'?'active':''}" data-act="vertexmode">↔ Sposta angoli</button><button class="tool ${mode==='tapvertices'?'active':''}" data-act="tapvertices">◎ Vertici a tocchi</button><button class="tool ${mode==='sketch'?'active':''}" data-act="sketchmode">✎ Disegno libero</button></div><div class="banner" style="border-left:5px solid #c56a24"><b>Correggi una parete senza rifare il disegno:</b> premi «Seleziona parete / arco», tocca il muro da togliere (oppure usa il numero nella sezione «Modifica parete o arco»), quindi premi «Elimina parete e unisci punti». Il programma rimuove il vertice alla fine del tratto e collega i vertici rimasti con una nuova parete. Puoi annullare subito l’operazione.</div><div class="drawingtools"><button class="btn danger" data-act="delwall" ${arcSelected>=0&&r.geometry.points.length>3?'':'disabled'}>✕ Elimina parete e unisci punti${arcSelected>=0?' · '+(arcSelected+1):''}</button><button class="btn ghost" data-act="arcmode">◎ Scegli parete da eliminare</button></div><p class="hint">${arcSelected<0?'Nessuna parete selezionata: tocca prima la parete sulla pianta.':`Parete ${arcSelected+1} selezionata. La cancellazione unirà i punti adiacenti; le quote risultanti andranno verificate.`}</p><div class="banner"><b>Elementi edilizi:</b> scegli Porta, Finestra o Pilastro e <b>tocca il disegno</b>. Con «Sposta elementi» trascina gli oggetti con il dito. Porte e finestre restano sulla parete; i pilastri si muovono nello spazio interno.</div><div class="drawingtools">${structTools()}</div><div class="plan-viewtools"><button type="button" class="btn ghost" data-act="fitplan">⊡ Centra e adatta la pianta</button><button type="button" class="btn ghost" data-act="expandplan">⛶ Vista grande</button><span class="hint" style="margin:0">Adattamento automatico, senza cambiare le quote.</span></div><svg id="plan" class="diagram" viewBox="0 0 900 540" aria-label="Disegna la stanza e posiziona aperture e pilastri"></svg><div class="drawingtools"><button class="btn ghost" data-act="undoedit" ${undoStack.length?'':'disabled'}>↶ Annulla ultima modifica</button><button class="btn ghost" data-act="redoedit" ${redoStack.length?'':'disabled'}>↷ Ripristina</button></div><div class="drawingtools">${mode==='tapvertices'?`<button class="btn primary" data-act="closepolygon" ${polygonDraft.length<3?'disabled':''}>Chiudi perimetro (${polygonDraft.length})</button><button class="btn" data-act="removevertex" ${!polygonDraft.length?'disabled':''}>Cancella ultimo punto dello schizzo</button>`:''}<button class="btn ghost" data-act="adjust">Adatta alle quote</button></div>`)}${card('Porte, finestre e pilastri',structEditor(r))}${card('Modifica parete o arco',editor)}${card('Misure reali',`<div class="twocol">${field('name','Nome ambiente','', 'text',r)}${select('work','Tipo di posa',['Tracce nuove','Impianto esistente','Canalina a vista','Cartongesso','Misto'],r)}</div><div class="threecol">${field('height','Altezza locale (m)','','number',r)}${field('socketH','Prese da terra (m)','','number',r)}${field('switchH','Comandi da terra (m)','','number',r)}</div>${field('boxH','Derivazione da terra (m)','','number',r)}${shapeDetail(r)}${angleEditor(r)}<div class="twocol">${field('diag','Diagonale / quota aggiuntiva (m o nota)','','text',r.geometry)}${select('measured','Quote confermate?', ['false','true'],r.geometry)}</div>${textarea('sketchNote','Appunti su angoli, nicchie, curve e misure',r)}`)}</div>`}
function lenScale(r){return perimeter(r)/(rawPerimeter(r.geometry.points)||1)}
function pathMeters(r,path,z0=0,z1=0){return rnd(path.slice(1).reduce((sum,b,i)=>sum+dist(path[i],b),0)*lenScale(r)+Math.abs(num(z0)-num(z1)),3)}
function routeGeometry(r,a,b,style='diretta',via=[]){let A=nodePt(r,a),B=nodePt(r,b),p;
 if(style==='spezzata'&&via.length)p=[A,...via.map(q=>({x:num(q.x),y:num(q.y)})),B];
 else if(style==='squadra')p=[A,{x:B.x,y:A.y},B];else p=[A,B];
 return{path:p,m:pathMeters(r,p,a.z,b.z),estimated:true}}
function ledPath(r,led){if(led.kind==='perimetro'){let out=roomOutline(r);return out.length?[...out,out[0]]:[]}
 if(led.kind==='parete'){let N=50;return Array.from({length:N+1},(_,i)=>wallPoint(r,led.wall,num(led.startT,0)+(num(led.endT,1)-num(led.startT,0))*i/N))}
 return [{x:num(led.a?.x),y:num(led.a?.y)},{x:num(led.b?.x),y:num(led.b?.y)}]}
function ledMeters(r,led){if(led.kind==='perimetro')return rnd(perimeter(r),3);
 if(led.kind==='parete')return rnd(Math.max(0,num(r.geometry.lengths[led.wall]))*Math.abs(num(led.endT,1)-num(led.startT,0)),3);
 return pathMeters(r,ledPath(r,led))}
function ledZ(r,plane){return plane==='soffitto'?num(r.height,2.7):plane==='zoccolino'?.1:plane==='pavimento'?0:1.8}
function syncLedFeeds(r){for(let led of (r.ledStrips||[])){let n=r.nodes.find(n=>n.id===led.feedId),arr=ledPath(r,led);if(!n||!arr.length)continue;let p=arr[0];n.x=rnd(p.x,2);n.y=rnd(p.y,2);n.z=num(led.z,ledZ(r,led.plane));n.mount=led.plane==='zoccolino'?'parete':led.plane;if(led.kind==='parete'){n.wall=led.wall;n.t=num(led.startT)}else if(led.kind==='perimetro'){n.wall=0;n.t=0}else{delete n.wall;delete n.t}}}
function addLed(r,kind,q=null,end=null){r.ledStrips??=[];let id=uid('LED'),idx=r.ledStrips.length+1,led={id,label:'LED'+idx,kind,plane:ledPlane,wall:0,startT:0,endT:1,a:q,b:end,z:ledZ(r,ledPlane),wattsPerM:9.6,voltage:'24 V',notes:'',feedId:uid('N')};
 if(kind==='parete'){led.wall=nearestWall(r,q).wall;led.plane=ledPlane==='pavimento'?'zoccolino':ledPlane;led.z=ledZ(r,led.plane)}
 if(kind==='perimetro'){led.plane='zoccolino';led.z=.1}
 if(kind==='libero'){if(!q||!end||!inPolygon(r,q)||!inPolygon(r,end)){notice='La striscia libera deve stare nell’area della stanza.';return false}if(ledPlane==='zoccolino'){led.plane='soffitto';led.z=ledZ(r,'soffitto')}}
 let points=ledPath(r,led);if(!points.length)return false;let start=points[0];r.ledStrips.push(led);let n={id:led.feedId,label:led.label,type:'led_feed',x:start.x,y:start.y,z:led.z,mount:led.plane,ledId:led.id};r.nodes.push(n);syncLedFeeds(r);r.confirmed=false;save();return true}
function ledEditor(r){let a=r.ledStrips||[];return `<div class="banner"><b>Illuminazione lineare:</b> la striscia LED è misurata in metri, non in punti luce. Il simbolo LED è il punto di alimentazione; driver, protezioni, tensione, potenza e sezione del cavo sono da verificare separatamente.</div><div class="drawingtools"><button class="tool ${mode==='led_wall'?'active':''}" data-act="ledtool" data-type="wall">▰ LED su una parete intera</button><button class="tool" data-act="ledperimeter">▣ LED lungo tutto lo zoccolino</button><button class="tool ${mode==='led_free'?'active':''}" data-act="ledtool" data-type="free">✎ LED linea libera (2 tocchi)</button></div><div class="drawingtools">${[['zoccolino','Zoccolino'],['parete','Parete'],['soffitto','Soffitto'],['pavimento','Pavimento']].map(([x,y])=>`<button class="tool ${ledPlane===x?'active':''}" data-act="ledplane" data-plane="${x}">${y}</button>`).join('')}</div><p class="hint">Per il LED su una parete: tocca il lato. Per il LED libero: tocca il punto iniziale e poi quello finale. Per lo zoccolino completo usa l'apposito tasto. <b>Il perimetro è lordo:</b> per porte, varchi e interruzioni usa segmenti separati e verifica le misure sul posto.</p>${!a.length?'<p class="muted small">Nessuna striscia LED inserita.</p>':a.map((l,i)=>`<div class="riquadro"><b>${E(l.label)}</b> · <b>${fmt(ledMeters(r,l))} m</b> · ${E(l.kind==='perimetro'?'Perimetro':l.kind==='parete'?'Parete '+(l.wall+1):'Linea libera')}<div class="threecol"><label class="field"><span>Quota (m)</span><input type="number" min="0" step="0.05" data-led="${i}" data-lfield="z" value="${num(l.z)}"></label><label class="field"><span>W/metro</span><input type="number" min="0" step="0.1" data-led="${i}" data-lfield="wattsPerM" value="${num(l.wattsPerM)}"></label><label class="field"><span>Tensione</span><select data-led="${i}" data-lfield="voltage">${['12 V','24 V','48 V','230 V','Da verificare'].map(v=>`<option ${l.voltage===v?'selected':''}>${v}</option>`).join('')}</select></label></div>${l.kind==='parete'?`<div class="twocol"><label class="field"><span>Inizio dalla parete (%)</span><input type="number" min="0" max="100" step="1" data-led="${i}" data-lfield="startPct" value="${rnd(l.startT*100,1)}"></label><label class="field"><span>Fine parete (%)</span><input type="number" min="0" max="100" step="1" data-led="${i}" data-lfield="endPct" value="${rnd(l.endT*100,1)}"></label></div>`:''}<label class="field"><span>Annotazioni: profilo, diffusore, posizione driver, colore luce</span><textarea data-led="${i}" data-lfield="notes">${E(l.notes||'')}</textarea></label><p class="hint">Potenza teorica della striscia ${fmt(ledMeters(r,l)*num(l.wattsPerM))} W; non comprende perdite del driver, margini o cadute di tensione.</p><button class="btn tiny danger" data-act="rmled" data-i="${i}">Elimina ${E(l.label)}</button></div>`).join('')}`}
const TYPES=[['quadro_elettrico','▣ Quadro elettrico'],['presa','Presa'],['derivazione','Derivazione'],['interruttore','Interruttore'],['deviatore','Deviatore'],['invertitore','Invertitore'],['luce','Luce'],['tv','Presa TV'],['tv_source','Distribuzione TV'],['dati','Rete dati'],['antincendio','Rivelatore/antincendio'],['citofono','Citofono'],['videocitofono','Videocitofono'],['pulsantiera_allarme','Tastiera allarme'],['sensore_allarme','Sensore intrusione'],['sirena','Sirena'],['telecamera','Telecamera'],['termostato','Termostato'],['clima','Climatizzazione'],['emergenza','Luce emergenza'],['domotica','Comando domotico'],['fotovoltaico','Fotovoltaico / accumulo'],['ricarica_ev','Ricarica EV'],['esterno','Impianto esterno'],['speciale','Altro dispositivo']];
function placementChoice(){return `<div class="banner"><b>2 · Dove lo installi?</b> Dopo aver scelto il simbolo, seleziona il piano. <b>Automatico</b> mette le luci a soffitto e usa una parete per gli altri punti solo quando tocchi vicino al muro; al centro, le derivazioni vanno a soffitto e le prese a pavimento. Se cambi simbolo o scegli «Sposta», la selezione torna su Automatico: puoi poi cambiarla manualmente.</div><div class="drawingtools">${[['auto','◎ Automatico'],['parete','▣ Parete'],['pavimento','▤ Pavimento flottante'],['soffitto','◻ Soffitto'],['libero','✥ Posizione libera']].map(([v,t])=>`<button class="tool ${placementPlane===v?'active':''}" data-act="plane" data-plane="${v}">${t}</button>`).join('')}</div>`}
function planeName(n){return n.mount|| (n.wall!==undefined?'parete':n.type==='luce'?'soffitto':'libero')}
function pointPosition(r,n){return n.wall!==undefined?'Parete '+(n.wall+1)+' · '+Math.round(num(n.t)*100)+'%':`${planeName(n)==='pavimento'?'Pavimento':planeName(n)==='soffitto'?'Soffitto':'Interno'} · X ${rnd(num(n.x))}, Y ${rnd(num(n.y))} (disegno)`}
function pagePoints(){let r=currentRoom();return `<div class="eyebrow">06 · Dispositivi</div><h1>Posiziona i punti</h1>${roomTabs()}${r.geometry.points.length<3?'<div class="banner warn">Prima crea la stanza nella scheda «Schizzo e misure». La pianta è ancora vuota.</div>':''}${card('Pianta interattiva',`<div class="banner"><b>1 · Scegli il dispositivo.</b> Poi scegli dove collocarlo e tocca la pianta (oppure appoggia e trascina il dito per posizionarlo). Per cambiare la posizione di un simbolo già inserito usa <b>↔ Sposta</b>. <b>↗ Collega</b> crea i collegamenti.</div><div class="drawingtools">${TYPES.map(([v,l])=>`<button class="tool ${mode===v?'active':''}" data-act="tool" data-type="${v}">${l}</button>`).join('')}<button class="tool ${mode==='move'?'active':''}" data-act="tool" data-type="move">↔ Sposta</button><button class="tool ${mode==='connect'?'active':''}" data-act="tool" data-type="connect">↗ Collega due punti</button><button class="tool ${mode==='erase'?'active':''}" data-act="tool" data-type="erase">✕ Elimina</button></div>${placementChoice()}<div class="banner"><b>Percorso del collegamento:</b> ${routeStyle==='diretta'?'diagonale libera':routeStyle==='squadra'?'a 90 gradi':'spezzata con punti intermedi'}.</div>${routeStyleButtons()}<div class="plan-viewtools"><button type="button" class="btn ghost" data-act="fitplan">⊡ Centra e adatta la pianta</button><button type="button" class="btn ghost" data-act="expandplan">⛶ Vista grande</button><span class="hint" style="margin:0">Adattamento automatico, senza cambiare le quote.</span></div><svg id="plan" class="diagram" viewBox="0 0 900 540" aria-label="Pianta: posiziona elementi su pareti, pavimento e soffitto; trascina e collega"></svg><p class="hint"><b>Controllo immediato:</b> sotto ogni simbolo compare S (soffitto), P (pavimento), M (parete), L (libero). Se compare M ma volevi il centro, premi «Sposta», lascia «Automatico» oppure scegli «Soffitto», e trascina il simbolo al centro. <b>Colori piccoli indicatori:</b> P = pavimento, S = soffitto, L = interno libero, M = parete. Nei punti interni è possibile modificare la quota dal prospetto. Le linee proposte sono solo ipotesi di tracciato: devono essere verificate, soprattutto per attraversamenti, salite, discese e ingombri.</p><div class="drawingtools"><button class="btn ghost" data-act="autoroute">Proponi tratte automatiche →</button></div>`)}${elevationPanel34(r)}${card('Punti inseriti e posizione di posa',`<div class="tablewrap"><table><thead><tr><th>ID</th><th>Tipo</th><th>Piano di installazione</th><th>Quota da pavimento (m)</th><th>Posizione</th></tr></thead><tbody>${r.nodes.map((n,i)=>`<tr><td><b>${E(n.label)}</b></td><td>${E(typeLabel(n.type))}</td><td><select data-mount="${i}">${[['parete','Parete'],['pavimento','Pavimento'],['soffitto','Soffitto'],['libero','Libero']].map(([v,t])=>`<option value="${v}" ${planeName(n)===v?'selected':''}>${t}</option>`).join('')}</select></td><td><input style="max-width:88px" inputmode="decimal" type="number" min="0" step=".05" data-z="${i}" value="${E(n.z)}"/></td><td>${E(pointPosition(r,n))}</td></tr>`).join('')}</tbody></table></div><p class="hint">Puoi cambiare il piano anche dopo aver inserito il punto. Per sganciare un dispositivo dalla parete scegli Pavimento, Soffitto o Libero, poi trascinalo.</p>${textarea('pointsNote','Note su moduli, serie civile, scatole 503/504/506, pavimento flottante, derivazioni a soffitto e vincoli',r)}`)}${card('Strisce LED e illuminazione lineare',ledEditor(r))}<div class="banner warn">Le tratte interne e a quote differenti sono stime preliminari: il tecnico deve confermare il percorso 3D, la canalizzazione, i conduttori e le verifiche normative.</div>`}
function routeStyleButtons(){return `<div class="drawingtools">${[['diretta','╱ Diretta / diagonale'],['squadra','┐ A 90°'],['spezzata','⌁ Spezzata: aggiungi vertici']].map(([v,t])=>`<button class="tool ${routeStyle===v?'active':''}" data-act="routestyle" data-style="${v}">${t}</button>`).join('')}</div><p class="hint">Collega due dispositivi. In modalità Spezzata, dopo il primo dispositivo tocca uno o più punti liberi della stanza, poi il dispositivo finale. Un percorso esistente può essere modificato con il pulsante «Modifica percorso» della sua riga.</p>`}
function routeLabel(rt){return String(rt.code||rt.from+' → '+rt.to)}
function manualRouteForm(r){let nodes=r.nodes;return `<div class="addrouteform"><h3>+ Nuova tratta manuale</h3><p class="hint">Assegna un codice come <b>1L2</b>, scegli due punti già presenti e indica il tipo di percorso. Dopo averla creata, puoi selezionarla sulla pianta e aggiungere vertici.</p><label class="field"><span>Codice / nome della tratta (es. 1L2)</span><input id="manual-code" type="text" maxlength="40" placeholder="1L2" autocomplete="off"></label><div class="twocol"><label class="field"><span>Da (punto di partenza)</span><select id="manual-from">${nodes.map((n,i)=>`<option value="${E(n.id)}">${E(n.label)} · ${E(typeLabel(n.type))}</option>`).join('')}</select></label><label class="field"><span>A (punto di arrivo)</span><select id="manual-to">${nodes.map((n,i)=>`<option value="${E(n.id)}" ${i===1?'selected':''}>${E(n.label)} · ${E(typeLabel(n.type))}</option>`).join('')}</select></label></div><div class="twocol"><label class="field"><span>Percorso iniziale</span><select id="manual-style"><option value="diretta">Diretto / diagonale</option><option value="squadra">A 90°</option><option value="spezzata">Spezzato (poi aggiungi vertici)</option></select></label><label class="field"><span>Utilizzo</span><select id="manual-use">${['manuale','prese','luce','comandi','tv','led'].map(k=>`<option value="${k}">${k==='manuale'?'Da definire':k}</option>`).join('')}</select></label></div><button class="btn primary" data-act="addmanualroute" ${nodes.length<2?'disabled':''}>+ Crea tratta e selezionala</button>${nodes.length<2?'<p class="notice">Inserisci almeno due dispositivi nella scheda precedente.</p>':''}</div>`}
function routeCards(r){return `<div class="rows">${r.routes.map(rt=>`<div class="routecard ${rt.id===selectedRouteId?'selected':''}"><div><span class="routecode">${E(routeLabel(rt))}</span> <b>${E(rt.from)} → ${E(rt.to)}</b> <span class="pill">${fmt(rt.m)} m</span></div><div class="small muted">${E(rt.use)} · ${E(rt.duct)} · ${E(rt.pathMode||'proposto')}</div><div class="routeactions"><button class="btn tiny ${rt.id===selectedRouteId?'primary':'ghost'}" data-act="selectroute" data-id="${E(rt.id)}">${rt.id===selectedRouteId?'✓ Selezionata':'◉ Seleziona sulla pianta'}</button><button class="btn tiny ghost" data-act="editrouteid" data-id="${E(rt.id)}">${editRouteId===rt.id?'Termina modifica':'Modifica percorso'}</button><button class="btn tiny ghost" data-act="routewall33" data-id="${E(rt.id)}">▣ Passa a muro</button><button class="btn tiny ghost" data-act="routedirect33" data-id="${E(rt.id)}">╱ Diretto</button><button class="btn tiny danger" data-act="deleterouteid" data-id="${E(rt.id)}">✕ Elimina questa tratta</button></div></div>`).join('')||'<div class="banner">Nessuna tratta nell’ambiente. Puoi collegare i simboli sul disegno o aggiungere manualmente una tratta qui sotto.</div>'}</div>`}
function routeHit(r,q,svg){let scl=svg.getBoundingClientRect().width/Math.max(1,svg.viewBox.baseVal.width);let limit=Math.min(37,Math.max(14,17/Math.max(.3,scl)));let best=null;for(let rt of r.routes){let pts=rt.path||[];for(let i=1;i<pts.length;i++){let a=pts[i-1],b=pts[i],dx=b.x-a.x,dy=b.y-a.y,dd=dx*dx+dy*dy,t=dd?Math.max(0,Math.min(1,((q.x-a.x)*dx+(q.y-a.y)*dy)/dd)):0,d=Math.hypot(q.x-a.x-t*dx,q.y-a.y-t*dy);if(d<=limit&&(!best||d<best.d))best={id:rt.id,d}}}return best?.id||null}
function deleteRouteId(r,id){let i=r.routes.findIndex(rt=>rt.id===id);if(i<0)return false;remember(r);r.routes.splice(i,1);if(selectedRouteId===id)selectedRouteId=null;if(editRouteId===id){editRouteId=null;mode='selectroute'}r.confirmed=false;save();return true}
function routesTable(r){return `<div class="tablewrap routeedit"><table><thead><tr><th>Codice / Da → A (nodi)</th><th>Uso</th><th>Metri</th><th>Conduttori unipolari</th><th>Cavo multipolare / coassiale</th><th>Canalizzazione</th><th>ID tubo fisico</th><th>Tracciato</th><th></th></tr></thead><tbody>${r.routes.map((rt,i)=>`<tr><td><label class="field"><span>Codice tratta</span><input type="text" maxlength="40" data-route="${i}" data-rfield="code" value="${E(rt.code||'')}" placeholder="Es. 1L2"></label><b>${E(rt.from)} → ${E(rt.to)}</b><br><span class="small muted">${E(rt.label||'')}</span><div class="drawingtools"><select data-route="${i}" data-rfield="fromId">${r.nodes.map(n=>`<option value="${E(n.id)}" ${rt.fromId===n.id?'selected':''}>${E(n.label)}</option>`).join('')}</select><select data-route="${i}" data-rfield="toId">${r.nodes.map(n=>`<option value="${E(n.id)}" ${rt.toId===n.id?'selected':''}>${E(n.label)}</option>`).join('')}</select></div></td><td><select data-route="${i}" data-rfield="use">${['manuale','prese','luce','comandi','tv','led'].map(t=>`<option value="${t}" ${rt.use===t?'selected':''}>${t}</option>`).join('')}</select></td><td><input type="number" step="0.01" min="0" data-route="${i}" data-rfield="m" value="${E(rt.m)}"/></td><td><input type="number" step="1" min="0" data-route="${i}" data-rfield="wires" value="${E(rt.wires)}"/></td><td><input type="number" step="0.01" min="0" data-route="${i}" data-rfield="cable" value="${E(rt.cable)}"/></td><td><select data-route="${i}" data-rfield="duct">${['Corrugato','Canalina','Tubo rigido','Esistente','Nessuna (solo rilievo)'].map(x=>`<option ${x===rt.duct?'selected':''}>${x}</option>`).join('')}</select></td><td><input type="text" style="max-width:84px" data-route="${i}" data-rfield="physicalId" value="${E(rt.physicalId||rt.id)}" title="Uguale se lo stesso tubo fisico" /></td><td><select data-route="${i}" data-rfield="pathMode">${[['diretta','Diagonale'],['squadra','A 90°'],['spezzata','Spezzata'],['perimetro','Perimetrale auto'],['muro','Lungo pareti (anche da punti interni)']].map(([v,t])=>`<option value="${v}" ${(rt.pathMode||'perimetro')===v?'selected':''}>${t}</option>`).join('')}</select><button class="btn tiny ${editRouteId===rt.id?'primary':'ghost'}" data-act="editroute" data-i="${i}">${editRouteId===rt.id?'Termina modifica':'Modifica percorso'}</button>${(rt.via||[]).length?`<button class="btn tiny danger" data-act="clearvia" data-i="${i}">Cancella vertici (${rt.via.length})</button>`:''}</td><td><button class="btn tiny danger" data-act="deleterouteid" data-id="${E(rt.id)}">Elimina tratta</button></td></tr>`).join('')}</tbody></table></div>`}
function pageRoutes(){let r=currentRoom(),q=calcRoom(r),selected=r.routes.find(x=>x.id===selectedRouteId);return `<div class="eyebrow">07 · Computo</div><h1>Tratte, corrugati e cavi</h1>${roomTabs()}${card('Gestisci i collegamenti',`<div class="banner"><b>Puoi ricominciare da zero.</b> Le tratte automatiche non sono obbligatorie. Tocca <b>Seleziona tratta</b>, poi una linea nel disegno, oppure premi "Seleziona" nell’elenco. Una tratta selezionata diventa <b>verde intenso</b>, anche se passa sopra una parete.</div><div class="routeactions"><button class="btn ${mode==='selectroute'?'primary':'ghost'}" data-act="selectroutemode">◉ Seleziona tratta sul disegno</button><button class="btn danger" data-act="deleteselectedroute" ${!selected?'disabled':''}>✕ Elimina tratta selezionata</button><button class="btn danger" data-act="clearallroutes" ${!r.routes.length?'disabled':''}>🗑 Cancella TUTTE le tratte (${r.routes.length})</button><button class="btn ghost" data-act="undoedit" ${!undoStack.length?'disabled':''}>↶ Annulla modifica</button><button class="btn ghost" data-act="redoedit" ${!redoStack.length?'disabled':''}>↷ Ripristina</button></div>${selected?`<div class="route-selected-note"><b>Tratta selezionata: ${E(routeLabel(selected))}</b> · ${E(selected.from)} → ${E(selected.to)} · ${fmt(selected.m)} m</div>`:'<p class="hint">Nessuna tratta selezionata. Tocca una linea oppure selezionala sotto.</p>'}${routeStyleButtons()}<div class="drawingtools"><button class="btn ghost" data-act="autoroute">↻ Rigenera proposta automatica</button><button class="tool ${mode==='connect'?'active':''}" data-act="tool" data-type="connect">↗ Collega due punti</button><button class="tool ${mode==='move'?'active':''}" data-act="tool" data-type="move">↔ Sposta simboli</button><button class="btn" data-act="confirmroom">${r.confirmed?'✓ Confermate':'Conferma misure tratte'}</button></div><div class="plan-viewtools"><button type="button" class="btn ghost" data-act="fitplan">⊡ Centra e adatta la pianta</button><button type="button" class="btn ghost" data-act="expandplan">⛶ Vista grande</button><span class="hint" style="margin:0">Adattamento automatico, senza cambiare le quote.</span></div><svg id="plan" class="diagram" viewBox="0 0 900 540" aria-label="Seleziona, collega o modifica le tratte elettriche"></svg><p class="hint">Le tratte che coincidono con i muri sono disegnate sopra il muro con una fascia bianca di separazione, una linea colorata e il codice identificativo: il muro non sostituisce la rappresentazione del collegamento.</p><div class="gridstats" style="margin-top:12px"><div class="stat"><strong>${fmt(q.duct)} m</strong><span>Corrugato tracciato</span></div><div class="stat"><strong>${fmt(q.wire)} m</strong><span>Conduttori unipolari</span></div><div class="stat"><strong>${fmt(q.cable)} m</strong><span>Cavo multipolare/coassiale</span></div></div>`)}${elevationPanel34(r)}${card('Elenco delle tratte — seleziona, modifica, elimina',`${routeCards(r)}${manualRouteForm(r)}<details><summary><b>Parametri tecnici avanzati di tutte le tratte</b></summary>${routesTable(r)}</details>${textarea('routesNote','Materiali, rientri, derivazioni, quote mancanti, passaggi vietati o ostacoli rilevati',r)}`)}<div class="banner warn">Il disegno indica percorsi preliminari. In particolare le diagonali, le attraversate nei muri e le differenze di quota devono essere confermate dal tecnico; questa demo non verifica automaticamente la fattibilità fisica o normativa del tracciato.</div>`}

function pageUtilities(){let arr=['Rete dati','Domotica','Citofono / videocitofono','Climatizzazione','Allarme intrusione','Rivelazione e allarme incendio','Illuminazione di emergenza','Videosorveglianza','Fotovoltaico / accumulo','Ricarica EV','Impianto esterno','Altro'];return `<div class="eyebrow">08 · Impianti aggiuntivi</div><h1>Utenze speciali</h1>${card('Seleziona le dotazioni',`<div class="choices">${arr.map(a=>`<label class="choice"><input type="checkbox" data-utility="${E(a)}" ${S.otherUsers.includes(a)?'checked':''}>${E(a)}</label>`).join('')}</div>${S.otherUsers.includes('Rivelazione e allarme incendio')?`<div class="banner warn"><b>Antincendio:</b> rilevare centrale, pulsanti manuali, rivelatori, segnalatori, alimentazioni, zone, cavi e percorsi. La classificazione e le prescrizioni di sistema richiedono una valutazione specifica.</div>${textarea('fireNote','Dettagli rivelazione / allarme incendio, zone, riferimenti e documentazione')}`:''}${textarea('finalNote','Altre utenze: potenze, predisposizioni, carichi e note generali')}`)}${card('Esito del sopralluogo',`${select('projectDoc','Documentazione progettuale e verifiche necessarie',['Non verificato','Presenti e visionati','Da acquisire','Non reperiti','Da valutare'])}${textarea('nextActions','Misure, foto, documenti e controlli mancanti prima del preventivo')}`)}`}
function calcRoom(r){let duct=0,wire=0,cable=0,canal=0,pipe=0,unduct=0;const ducts=new Map();for(let rt of r.routes){let m=Math.max(0,num(rt.m)),id=rt.physicalId||rt.id,old=ducts.get(id);if(!old||m>old.m)ducts.set(id,{m,duct:rt.duct});wire+=m*Math.max(0,num(rt.wires));cable+=Math.max(0,num(rt.cable))}for(let value of ducts.values()){if(value.duct==='Corrugato')duct+=value.m;else if(value.duct==='Canalina')canal+=value.m;else if(value.duct==='Tubo rigido')pipe+=value.m;else unduct+=value.m}let led=(r.ledStrips||[]).reduce((a,x)=>a+ledMeters(r,x),0),ledWatts=(r.ledStrips||[]).reduce((a,x)=>a+ledMeters(r,x)*num(x.wattsPerM),0);return{duct,wire,cable,canal,pipe,unduct,total:duct+canal+pipe,ducts:ducts.size,led:rnd(led,3),ledWatts:rnd(ledWatts,2)}}
function routeByWall33(r,a,b){
 let wa=a.wall===undefined?nearestWall(r,nodePt(r,a)):null,wb=b.wall===undefined?nearestWall(r,nodePt(r,b)):null;
 let aa=a.wall===undefined?{...a,wall:wa.wall,t:wa.t}:a,bb=b.wall===undefined?{...b,wall:wb.wall,t:wb.t}:b;
 let pathInfo=wallPath(r,aa,bb),wallPts=wallPathRoute(r,aa,bb,pathInfo.dir);
 let start=nodePt(r,a),end=nodePt(r,b),pts=[start,...wallPts,end];
 let px=pts.slice(1).reduce((v,p,i)=>v+dist(pts[i],p),0),scale=perimeter(r)/Math.max(1,rawPerimeter(r.geometry.points));
 return {path:pts,m:rnd(px*scale+Math.abs(num(a.z)-num(b.z)),2)};
}
function routeUpdate33(r,rt){let a=r.nodes.find(n=>n.id===rt.fromId),b=r.nodes.find(n=>n.id===rt.toId);if(!a||!b)return;let g=rt.pathMode==='muro'?routeByWall33(r,a,b):rt.pathMode==='perimetro'?connectionGeometry(r,a,b):routeGeometry(r,a,b,rt.pathMode||'diretta',rt.via||[]);rt.path=g.path;rt.m=rnd(g.m);rt.from=a.label;rt.to=b.label;rt.estimated=true;rt.confirmed=false;}
function recomputeManual(r,rt){let a=r.nodes.find(n=>n.id===rt.fromId),b=r.nodes.find(n=>n.id===rt.toId);if(!a||!b)return;rt.from=a.label;rt.to=b.label;if(a.wall!==undefined&&b.wall!==undefined){let p=wallPath(r,a,b);rt.path=wallPathRoute(r,a,b,p.dir);rt.m=rnd(p.m+Math.abs(num(a.z)-num(b.z)))}else{let realPer=perimeter(r),pxPer=rawPerimeter(r.geometry.points),scale=pxPer?realPer/pxPer:0;let g=connectionGeometry(r,a,b);rt.path=g.path;rt.m=rnd(g.m);rt.estimated=true}}

function totals(){let out={duct:0,wire:0,cable:0,canal:0,pipe:0,led:0,ledWatts:0,points:0,routes:0,warnings:[]};for(let r of S.roomList){let q=calcRoom(r);out.duct+=q.duct;out.wire+=q.wire;out.cable+=q.cable;out.canal+=q.canal;out.pipe+=q.pipe;out.led+=q.led;out.ledWatts+=q.ledWatts;out.points+=r.nodes.length;out.routes+=r.routes.length;if((r.ledStrips||[]).some(l=>l.kind==='perimetro'))out.warnings.push(r.name+': LED sul perimetro lordo: scontare aperture, varchi e interruzioni di posa');if((r.ledStrips||[]).length)out.warnings.push(r.name+': alimentatori e protezioni LED, eventuale caduta di tensione e lunghezza massima da verificare');if(!r.geometry.measured)out.warnings.push(r.name+': quote pareti non confermate');if((r.kind!=='rettangolo'||Object.keys(r.geometry.arcs||{}).length)&&!r.geometry.diag)out.warnings.push(r.name+': mancano diagonali o angoli per validare la geometria');if(!r.nodes.length)out.warnings.push(r.name+': punti elettrici non inseriti');if(r.nodes.some(n=>planeName(n)!=='parete')&&r.routes.some(rt=>rt.estimated))out.warnings.push(r.name+': tratte con punti interni / soffitto / pavimento da verificare sul percorso reale (quote 3D e ostacoli)');if(!r.routes.length&&r.nodes.length)out.warnings.push(r.name+': nessuna tratta generata');if(!r.confirmed&&r.routes.length)out.warnings.push(r.name+': tratte proposte non confermate dal tecnico');const seenDuct=new Map();for(let rt of r.routes){let id=rt.physicalId||rt.id,old=seenDuct.get(id);if(old&&(old.duct!==rt.duct||Math.abs(num(old.m)-num(rt.m))>.05))out.warnings.push(r.name+': ID tubo '+id+' condiviso con lunghezze o materiali discordanti');else seenDuct.set(id,rt)}if(r.nodes.filter(n=>n.type==='presa').length&&!r.nodes.some(n=>n.type==='derivazione'))out.warnings.push(r.name+': manca un nodo di derivazione/allacciamento');if(r.nodes.some(n=>n.type==='tv')&&!r.nodes.some(n=>n.type==='tv_source'))out.warnings.push(r.name+': origine distribuzione TV non presente');for(let n of r.nodes){if(n.type==='luce'&&!r.nodes.some(t=>['interruttore','deviatore','invertitore'].includes(t.type)))out.warnings.push(r.name+': punto luce senza comando rilevato')}}if(!S.feedMeasured)out.warnings.push('Distanza alimentazione dal quadro non misurata');if(!S.customer)out.warnings.push('Cliente non inserito');return out}

 return card('Prospetto frontale della parete · v3.6',`<p class="hint">La stessa presa compare in pianta e qui. Seleziona un simbolo, trascinalo oppure modifica le quote. Le distanze sono misurate dall'inizio della parete e dal pavimento.</p><label class="field"><span>Parete da visualizzare</span><select id="elev-wall34">${opts}</select></label><div style="overflow-x:auto"><svg id="elev-svg34" viewBox="0 0 ${svgW} ${svgH}" style="width:100%;min-width:320px;background:#f7faf9;border:1px solid #c9d8d8;border-radius:12px;touch-action:none" aria-label="Prospetto frontale: trascina i dispositivi sulle pareti"><rect x="${left}" y="${top-50}" width="${width}" height="35" fill="#fff1d7"/><rect x="${left}" y="${top+height+15}" width="${width}" height="35" fill="#e1edf9"/><text x="${left+8}" y="${top-29}" font-size="12" fill="#7c4a0c">SOPRA SOFFITTO · 5–10 cm</text><text x="${left+8}" y="${top+height+38}" font-size="12" fill="#28537d">SOTTO PAVIMENTO · 5–10 cm</text><rect x="${left}" y="${top}" width="${width}" height="${height}" fill="#e8f1f1" stroke="#155c64" stroke-width="2"/>${lines}${heights}${openings}${pillars}${wallRoutes}${symbols}<text x="380" y="405" text-anchor="middle" font-size="12" fill="#415b61">Distanza dall'angolo iniziale (metri) · parete ${elevWall34+1}</text></svg></div><p class="hint">Lunghezza ${fmt(L)} m · Altezza ${fmt(H)} m. ${r.geometry.arcs?.[elevWall34]?'Parete curva: prospetto sviluppato lungo l’arco.':''}</p><label class="field"><span>Dispositivo da modificare</span><select id="elev-node34"><option value="">— Seleziona un dispositivo —</option>${nodeopts}</select></label>${chosen?`<div class="twocol"><label class="field"><span>Distanza dall'angolo iniziale (m)</span><input id="elev-x34" type="number" min="0" max="${L}" step="0.01" inputmode="decimal" value="${rnd(L*num(chosen.t),3)}"></label><label class="field"><span>Altezza dal pavimento (m)</span><input id="elev-z34" type="number" min="0" max="${H}" step="0.01" inputmode="decimal" value="${rnd(num(chosen.z),3)}"></label></div><button class="btn primary" type="button" data-act="elev-save34">✓ Applica le quote alla pianta</button>`:'<div class="banner">Seleziona un dispositivo già installato sulla parete. Per inserirne uno nuovo, usa gli strumenti della pianta qui sopra e tocca vicino al muro.</div>'}<div class="banner"><b>Legenda:</b> QE = quadro elettrico; P = presa; L = luce; D = derivazione; S = comando. Le linee grigie tratteggiate sono riferimenti di quota; le linee arancioni rappresentano solo collegamenti indicativi tra dispositivi sulla stessa parete, non percorsi fisici confermati. Porte, finestre e pilastri vicini alla parete sono visualizzati in prospetto. Le quote e i percorsi elettrici vanno verificati sul posto.</div>${routeEditor}`);

function elevationUpdate34(id,meters,z){let r=currentRoom(),n=r.nodes.find(n=>n.id===id);if(!n||n.wall===undefined)return;let L=Math.max(.01,num(r.geometry.lengths[n.wall])),H=Math.max(.1,num(r.height,2.7));remember(r);n.t=Math.max(0,Math.min(1,meters/L));n.z=Math.max(0,Math.min(H,z));refreshRoutes(r,true);save();show(false)}
document.addEventListener('change',e=>{if(e.target.id==='elev-wall34'){elevWall34=+e.target.value;elevSelected34='';show(false)}else if(e.target.id==='elev-node34'){elevSelected34=e.target.value;show(false)}},true);

document.addEventListener('pointerdown',e=>{let el=e.target.closest?.('[data-elev-node]');if(!el)return;let svg=$('elev-svg34');if(!svg)return;elevSelected34=el.dataset.elevNode;elevDrag34={id:elevSelected34,svg};svg.setPointerCapture?.(e.pointerId);e.preventDefault()},true);
document.addEventListener('pointermove',e=>{if(!elevDrag34)return;let svg=elevDrag34.svg,box=svg.getBoundingClientRect(),r=currentRoom();if(!box.width||!box.height)return;let px=(e.clientX-box.left)*760/box.width,py=(e.clientY-box.top)*420/box.height;let L=num(r.geometry.lengths[elevWall34]),H=num(r.height,2.7);elevDrag34.m=Math.max(0,Math.min(L,(px-55)/660*L));elevDrag34.z=Math.max(0,Math.min(H,(1-(py-65)/255)*H));let el=svg.querySelector('[data-elev-node="'+elevDrag34.id+'"]');if(el)el.setAttribute('transform',`translate(${Math.max(55,Math.min(715,px))},${Math.max(28,Math.min(283,py))})`)},true);
document.addEventListener('pointerup',e=>{if(!elevDrag34)return;let d=elevDrag34;elevDrag34=null;let n=currentRoom().nodes.find(n=>n.id===d.id);if(n&&d.m!==undefined)elevationUpdate34(d.id,d.m,d.z);else show(false)},true);


function saveElevationRoute36(rt,mode,z,cm){let r=currentRoom();if(!rt)return;remember(r);let H=Math.max(.1,num(r.height,2.7));rt.elevation36={mode:['parete','pavimento','soffitto'].includes(mode)?mode:'parete',z:Math.max(0,Math.min(H,num(z,1.2))),offset:Math.max(.05,Math.min(.1,num(cm,5)/100))};rt.estimated=true;rt.confirmed=false;r.confirmed=false;save();show(false)}

// v3.7: PWA offline, seconda copia dati in IndexedDB e stato di backup.
const OFFLINE_DB37='ass-ai-elettric-v37',OFFLINE_STORE37='snapshots';let offlineLastSaved37=0,offlinePending37=false;
function offlineDB37(){return new Promise((ok,fail)=>{if(!('indexedDB' in window))return fail(new Error('IndexedDB non disponibile'));let req=indexedDB.open(OFFLINE_DB37,1);req.onupgradeneeded=()=>{if(!req.result.objectStoreNames.contains(OFFLINE_STORE37))req.result.createObjectStore(OFFLINE_STORE37)};req.onsuccess=()=>ok(req.result);req.onerror=()=>fail(req.error)})}
async function localSnapshot37(){if(offlinePending37)return;offlinePending37=true;try{let db=await offlineDB37(),data=JSON.stringify(slimState());await new Promise((ok,fail)=>{let tx=db.transaction(OFFLINE_STORE37,'readwrite');tx.objectStore(OFFLINE_STORE37).put({data,at:new Date().toISOString()},'current');tx.oncomplete=ok;tx.onerror=()=>fail(tx.error)});offlineLastSaved37=Date.now()}catch(e){console.warn('Copia IndexedDB non riuscita',e)}finally{offlinePending37=false;offlineStatus37()}}
async function restoreLocalSnapshot37(){try{let db=await offlineDB37();let obj=await new Promise((ok,fail)=>{let tx=db.transaction(OFFLINE_STORE37,'readonly');let req=tx.objectStore(OFFLINE_STORE37).get('current');req.onsuccess=()=>ok(req.result);req.onerror=()=>fail(req.error)});if(obj?.data&&!localStorage.getItem(KEY)){let recovered=JSON.parse(obj.data);if(recovered?.roomList?.length){S=recovered;localStorage.setItem(KEY,obj.data);notice='Rilievo recuperato dalla copia locale IndexedDB.';show(false)}}}catch(e){console.warn('Ripristino locale non disponibile',e)}}
function offlineStatus37(){let el=$('offline-status37');if(!el)return;let online=navigator.onLine;el.className=online?'online':'saved';el.textContent=(online?'● Online':'● Offline')+' · '+(offlineLastSaved37?'Copia locale salvata':'Archivio locale attivo')+' · Cloud non configurato'}
function exportOffline37(){let data={format:'Ass_AI_Elettric_v3_7',exportedAt:new Date().toISOString(),project:slimState()};let blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='Ass_AI_Elettric_backup_'+new Date().toISOString().slice(0,10)+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),10000)}
window.addEventListener('online',offlineStatus37);window.addEventListener('offline',offlineStatus37);
window.addEventListener('load',()=>{offlineStatus37();restoreLocalSnapshot37().then(localSnapshot37);$('offline-backup37')?.addEventListener('click',exportOffline37);if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./Ass_AI_Elettric_sw_v3_7.js').catch(e=>console.warn('Offline cache non disponibile',e))});
