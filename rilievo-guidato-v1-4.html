<style>
:root{--bg:#f6f7f5;--card:#fff;--ink:#202b2b;--mute:#536363;--line:#d9e1dd;--teal:#155c64;--tint:#e7f2f2;--orange:#c26a18;--blue:#2564c0;--purple:#7c4ac1;--warn:#9c5b15;--warnbg:#fff5e4;--red:#ba443a;--body:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.48 var(--body)}button,input,select,textarea{font:inherit}button{cursor:pointer}button:disabled{opacity:.45;cursor:not-allowed}a{color:var(--teal)}h1{font-size:clamp(24px,3.7vw,36px);letter-spacing:-.035em;line-height:1.1;margin:6px 0 10px}h2{font-size:19px;letter-spacing:-.02em;margin:2px 0 10px}h3{font-size:15px;margin:4px 0 9px}.muted{color:var(--mute)}.small{font-size:12px}.xs{font-size:11px}.bold{font-weight:740}.mono{font-variant-numeric:tabular-nums;font-family:ui-monospace,Menlo,Consolas,monospace}.shell{width:min(1060px,100%);margin:auto;padding:0 18px}.head{position:sticky;z-index:10;top:0;background:var(--bg);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}.headrow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0 8px}.logo{display:flex;gap:9px;align-items:center;font-weight:850;color:var(--teal);font-size:14px;line-height:1.2}.mark{background:var(--teal);color:#fff;padding:7px 10px;border-radius:9px;font-size:23px}.tools{display:flex;gap:6px}.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:9px;padding:10px 14px;font-weight:700;font-size:13px}.btn.primary{background:var(--teal);border-color:var(--teal);color:#fff}.btn.ghost{background:transparent;border-color:var(--teal);color:var(--teal)}.btn.danger{border-color:var(--red);color:var(--red)}.btn.tiny{padding:5px 9px;font-size:12px}.progress{display:flex;gap:3px;padding-bottom:9px}.progress>span{height:4px;flex:1;border-radius:6px;background:var(--line)}.progress>span.done{background:var(--teal)}.stage{padding-top:24px;padding-bottom:120px}.eyebrow{font-size:12px;text-transform:uppercase;font-weight:800;color:var(--teal);letter-spacing:.09em}.lead{color:var(--mute);margin:0 0 18px}.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:17px;margin-bottom:14px}.card.warn{background:var(--warnbg);border-color:#ead8bb}.field{display:block;margin:0 0 14px}.field>span,.label{display:block;color:var(--mute);font-size:12px;font-weight:700;margin-bottom:5px}.field>input,.field>select,.field>textarea,td input,td select{width:100%;background:var(--card);color:var(--ink);border:1px solid #cbd8d4;padding:10px;border-radius:8px;min-width:0}.field>textarea{min-height:80px;resize:vertical}.field>input:focus,.field>textarea:focus,.field>select:focus,td input:focus{outline:2px solid #7ab3b9}.twocol{display:grid;grid-template-columns:1fr 1fr;gap:12px}.threecol{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.choices{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0 15px}.choice{display:flex;gap:6px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:9px 11px;background:var(--card);cursor:pointer;font-size:13px}.choice:has(input:checked){border-color:var(--teal);background:var(--tint)}.choice input{accent-color:var(--teal)}.hint{font-size:12px;color:var(--mute);margin:7px 0 14px}.tag{display:inline-block;border-radius:5px;background:var(--tint);color:var(--teal);font-size:11px;font-weight:800;padding:3px 7px}.tag.warn{background:var(--warnbg);color:var(--warn)}.banner{background:var(--tint);border-radius:10px;padding:12px 14px;font-size:13px;margin-bottom:13px}.banner.warn{background:var(--warnbg)}.banner.red{background:#fcebe9;color:#912921}.gridstats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.stat{border:1px solid var(--line);background:#fff;border-radius:11px;padding:13px}.stat strong{display:block;font-size:24px;line-height:1.1}.stat span{font-size:11px;color:var(--mute)}.nav{position:fixed;bottom:0;left:0;right:0;background:var(--bg);border-top:1px solid var(--line);padding:9px 0 calc(10px + env(safe-area-inset-bottom))}.navrow{display:flex;justify-content:space-between;gap:10px;align-items:center}.navrow button{min-width:110px}table{width:100%;border-collapse:collapse;font-size:12px}th,td{border-bottom:1px solid var(--line);padding:8px 6px;vertical-align:top;text-align:left}th{color:var(--mute);font-weight:750}td.num{text-align:right}.tablewrap{overflow-x:auto}.tablewrap table{min-width:570px}.tool,.btn{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation}.diagram{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;border:1px solid #ccd6d3;border-radius:10px;background:#fff;width:100%;display:block;touch-action:none;user-select:none;height:auto;aspect-ratio:1.35;max-height:510px}.drawingtools{display:flex;flex-wrap:wrap;gap:6px;margin:11px 0}.tool{border:1px solid var(--line);border-radius:8px;padding:7px 10px;background:#fff;font-size:12px;font-weight:750}.tool.active{background:var(--teal);color:#fff}.roomnav{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 13px}.roomnav button.active{background:var(--teal);color:#fff}.rows{display:grid;gap:8px}.rowline{display:flex;justify-content:space-between;gap:9px;align-items:center;padding:10px;border:1px solid var(--line);border-radius:9px;font-size:13px}.rowline>.name{flex:1}.rowline .smallinput{max-width:100px;padding:7px!important}.split{display:grid;grid-template-columns:1.15fr .85fr;gap:14px}.pill{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:3px 9px;font-size:11px}.warnlist{margin:8px 0;padding-left:21px}.warnlist li{margin:5px 0}.footerline{border-top:1px solid var(--line);padding-top:10px;color:var(--mute);font-size:12px}.caption{font-size:12px;color:var(--mute)}.mini{max-width:95px!important;padding:7px 5px!important;font-size:12px}.notice{font-size:12px;color:var(--warn)}.steps{display:flex;gap:8px;flex-wrap:wrap}.steps>span{font-size:12px;background:var(--tint);border-radius:5px;padding:5px 8px}.nobreak{break-inside:avoid}.paper{display:none}.checkboxline{display:flex;gap:8px;align-items:flex-start;margin:7px 0;font-size:13px}.checkboxline input{accent-color:var(--teal);margin-top:3px}.routeedit td select{min-width:110px}.routeedit td input{min-width:69px}.routeedit tr.dis td{opacity:.5}.right{text-align:right}.alert{color:var(--red);font-weight:700}.ok{color:var(--teal);font-weight:750}
@media(max-width:750px){.split{grid-template-columns:1fr}.threecol{grid-template-columns:1fr 1fr}.gridstats{grid-template-columns:1fr 1fr}.tools .hidephone{display:none}}

<body><div class="head"><div class="shell"><div class="headrow"><div class="logo"><span class="mark">ϟ</span><span>RILIEVO ELETTRICO GUIDATO<br><span class="muted small">Laboratorio demo v1.4 · Agente</span></span></div><div class="tools"><button class="btn tiny" data-act="example">Esempio</button><button class="btn tiny hidephone" data-act="backup">Backup</button><button class="btn tiny" data-act="new">Nuovo</button></div></div><div id="progress" class="progress"></div></div></div><main class="shell stage" id="app"></main><div class="nav"><div class="shell navrow"><button class="btn" id="back">← Indietro</button><span class="small muted" id="counter"></span><button class="btn primary" id="forward">Avanti →</button></div></div><article class="paper shell" id="report"></article>
<script>
'use strict';
const KEY='rilievo-demo-v14';const $=id=>document.getElementById(id);const E=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const num=(v,d=0)=>{let n=parseFloat(String(v??'').replace(',','.'));return Number.isFinite(n)?n:d};const rnd=(v,d=2)=>Math.round((v+Number.EPSILON)*10**d)/10**d;const fmt=v=>rnd(v).toLocaleString('it-IT',{maximumFractionDigits:2});const uid=(p='N')=>p+Math.random().toString(36).slice(2,8);const clone=a=>JSON.parse(JSON.stringify(a));const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
const rect=[{x:260,y:450},{x:620,y:450},{x:620,y:90},{x:260,y:90}];const concave=[{x:160,y:430},{x:740,y:430},{x:740,y:245},{x:525,y:245},{x:525,y:90},{x:160,y:90}];const penta=[{x:170,y:430},{x:735,y:430},{x:745,y:220},{x:515,y:95},{x:155,y:145}];const hexa=[{x:250,y:430},{x:660,y:430},{x:750,y:325},{x:665,y:125},{x:335,y:115},{x:160,y:275}];const circ=Array.from({length:16},(_,i)=>({x:450+185*Math.cos(2*Math.PI*i/16),y:265+185*Math.sin(2*Math.PI*i/16)}));
function room(name='Camera',kind='rettangolo'){let pts=kind==='L'?clone(concave):kind==='pentagono'?clone(penta):kind==='esagono'?clone(hexa):kind==='tonda'?clone(circ):clone(rect);let r={id:uid('R'),name,kind,height:2.7,socketH:.4,switchH:1.2,boxH:2.4,geometry:{points:pts,lengths:[],diag:'',measured:false,origin:'preset'},nodes:[],routes:[],notes:'',work:'Tracce nuove',special:'',pointsNote:'',routesNote:'',sketchNote:'',confirmed:false};r.geometry.lengths=pts.map((p,i)=>rnd(dist(p,pts[(i+1)%pts.length])*((kind==='rettangolo'?4/595:kind==='tonda'?Math.PI*4/16:4/600)),2));if(kind==='rettangolo')r.geometry.lengths=[4,4,4,4];if(kind==='tonda')r.geometry.lengths=Array(16).fill(rnd(Math.PI*4/16,3));return r}
function initial(){return{practice:'DEMO-'+new Date().toISOString().slice(0,10),date:new Date().toISOString().slice(0,10),agent:'',customer:'',phone:'',email:'',address:'',city:'',kind:'',status:'',intervention:'',supply:'',notes:'',projectDoc:'Non verificato',doc:'Non verificato',diri:'Non verificato',ground:'Non verificato',groundChecks:'Da verificare',documentsNote:'',supplyNote:'',otherUsers:[],fireNote:'',safetyNote:'',roomList:[room()],finalNote:'',nextActions:'',reserveText:'',feedMeasured:false,feedLen:0,waste:10}}
function example(){let s=initial();Object.assign(s,{practice:'DEMO-4X4',agent:'Tecnico dimostrativo',customer:'Cliente esempio (inventato)',address:'Via Esempio 1',city:'Comune dimostrativo',kind:'Appartamento',status:'Esistente libero',intervention:'Rifacimento completo',supply:'Monofase',notes:'Locale campione: il tecnico deve verificare tutte le misure e i collegamenti.',otherUsers:['Rete dati'],doc:'Non reperita',ground:'Non verificato'});let r=s.roomList[0];r.name='Camera 4 × 4';r.geometry.measured=true;r.geometry.diag='5.66';r.geometry.lengths=[4,4,4,4];r.notes='Stanza non arredata. Tratte da verificare rispetto agli ingombri e alla struttura.';r.work='Tracce nuove';r.confirmed=false;let sp=[['P1',0,.38],['P2',0,.72],['P3',1,.23],['P4',1,.72],['P5',2,.26],['P6',2,.73],['P7',3,.56]];sp.forEach(([label,w,t])=>r.nodes.push({id:uid('N'),label,type:'presa',wall:w,t,x:0,y:0,z:.4}));r.nodes.push({id:uid('N'),label:'D1',type:'derivazione',wall:0,t:.15,x:0,y:0,z:2.4});r.nodes.push({id:uid('N'),label:'S1',type:'interruttore',wall:0,t:.2,x:0,y:0,z:1.2});r.nodes.push({id:uid('N'),label:'TV1',type:'tv',wall:3,t:.72,x:0,y:0,z:.4});r.nodes.push({id:uid('N'),label:'TV0',type:'tv_source',wall:0,t:.1,x:0,y:0,z:2.4});r.nodes.push({id:uid('N'),label:'L1',type:'luce',x:450,y:270,z:2.7});autoRoutes(r);return s}
let S=initial();try{let raw=localStorage.getItem(KEY);if(raw){let obj=JSON.parse(raw);if(obj?.roomList?.length)S=obj}}catch(e){}let page=0,roomIndex=0,mode='point',drawing=false,stroke=[],notice='';let moving=null,vertexDrag=null,connectAnchor=null,connectPreview=null,connectPointer=null,polygonDraft=[],draftPointer=null;
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
const definedStages=[['intro','Pratica'],['building','Immobile'],['docs','Documenti'],['rooms','Ambienti'],['shape','Disegno e misure'],['points','Punti elettrici'],['routes','Tratte e cavi'],['utilities','Utenze'],['summary','Riepilogo']];function stages(){return definedStages.filter(([k])=>!(k==='docs'&&S.status==='Nuova costruzione'))}function keyPage(){return stages()[page]?.[0]||'summary'}const currentRoom=()=>S.roomList[roomIndex]||S.roomList[0];
function field(key,label,placeholder='',type='text',obj=S){return `<label class="field"><span>${E(label)}</span><input data-key="${key}" ${obj===S?'':obj===currentRoom().geometry?'data-scope="geometry"':'data-scope="room"'} type="${type}" placeholder="${E(placeholder)}" value="${E(obj[key])}"></label>`}
function textarea(key,label,obj=S){return `<label class="field"><span>${E(label)}</span><textarea data-key="${key}" ${obj===S?'':'data-scope="room"'}>${E(obj[key])}</textarea></label>`}
function select(key,label,values,obj=S){return `<label class="field"><span>${E(label)}</span><select data-key="${key}" ${obj===S?'':'data-scope="room"'}>${values.map(x=>`<option ${x===obj[key]?'selected':''} value="${E(x)}">${E(x||'Seleziona...')}</option>`).join('')}</select></label>`}
function card(title,content,subtitle=''){return `<section class="card"><h2>${title}</h2>${subtitle?`<p class="muted small">${subtitle}</p>`:''}${content}</section>`}
function pageIntro(){return `<div class="eyebrow">01 · Sopralluogo</div><h1>Rilievo tecnico guidato</h1><p class="lead">Una raccolta strutturata di misure e informazioni. Nessun prezzo o coefficiente riservato al titolare viene archiviato qui.</p>${card('Identificazione pratica',`<div class="twocol">${field('practice','Codice pratica')}${field('date','Data sopralluogo','','date')}</div>${field('agent','Operatore incaricato')}${field('customer','Cliente / committente')}<div class="twocol">${field('phone','Telefono')}${field('email','Email','','email')}</div>${field('address','Indirizzo cantiere')}${field('city','Comune')}`)}${card('Annotazioni del primo incontro',textarea('notes','Richieste, esigenze e condizioni comunicate dal cliente'))}<div class="banner">Per una prova immediata premi <b>Esempio</b> in alto. Per un rilievo nuovo inserisci i tuoi dati e prosegui.</div>`}
function pageBuilding(){return `<div class="eyebrow">02 · Contesto</div><h1>Immobile e intervento</h1><p class="lead">Queste risposte aprono soltanto le domande pertinenti.</p>${card('Caratteristiche principali',`${select('kind','Tipo immobile',['','Appartamento','Villa / unifamiliare','Condominio parti comuni','Negozio / ufficio','Laboratorio / capannone','Altro'])}${select('status','Stato edificio',['','Nuova costruzione','Esistente abitato','Esistente libero'])}${select('intervention','Lavorazione',['','Impianto nuovo','Rifacimento completo','Ampliamento','Adeguamento parziale','Manutenzione / guasto'])}${select('supply','Alimentazione',['','Monofase','Trifase','Da verificare'])}${textarea('supplyNote','Quadro, contatore, messa a terra, vincoli e informazioni sulla fornitura')}`)}${S.supply==='Trifase'?card('Approfondimento trifase',`<div class="banner warn">Registrare carichi, ripartizione delle fasi e schema; non definire sezioni o protezioni automaticamente.</div>${textarea('safetyNote','Note su alimentazione trifase e verifiche richieste')}`):''}`}
function pageDocs(){return `<div class="eyebrow">03 · Verifiche</div><h1>Documentazione esistente</h1><p class="lead">La presenza dichiarata di un documento non equivale a documento visionato o a impianto sicuro.</p>${card('Dichiarazioni e verifiche',`${select('doc','Di.Co. impianto elettrico',['Non verificato','Presente e visionata','Dichiarata ma non visionata','Non reperita'])}${select('diri','Di.Ri. (applicabilità da valutare)',['Non verificato','Presente e visionata','Dichiarata ma non visionata','Non reperita','Non applicabile'])}${select('ground','Documentazione relativa all’impianto di terra',['Non verificato','Inclusa nella Di.Co.','Documentazione separata visionata','Dichiarata ma non visionata','Non reperita'])}${select('groundChecks','Verifiche/misure di terra',['Da verificare','Rapporti presenti','Misure richieste','Non applicabile per il rilievo'])}${select('projectDoc','Progetto e schemi disponibili',['Non verificato','Presenti e visionati','Da acquisire','Non reperiti','Da valutare'])}${textarea('documentsNote','Estremi dei documenti, annotazioni, anomalie e allegati da richiedere')}`)}<div class="banner warn">Di.Co. e documenti della messa a terra vanno valutati caso per caso; il rilievo non certifica la conformità.</div>`}
function pageRooms(){return `<div class="eyebrow">04 · Elenco</div><h1>Ambienti da rilevare</h1><p class="lead">Ogni stanza avrà una propria geometria, le proprie quote, i punti e le tratte.</p>${card('Ambienti',`<div class="rows">${S.roomList.map((r,i)=>`<div class="rowline"><b class="name">${E(r.name)} <span class="small muted">${r.geometry.points.length} pareti${r.kind==='tonda'?' · curva':''}</span></b><button class="btn tiny" data-act="selectroom" data-i="${i}">Apri</button><button class="btn tiny danger" data-act="delroom" data-i="${i}" ${S.roomList.length===1?'disabled':''}>Elimina</button></div>`).join('')}</div><div class="drawingtools"><button class="btn ghost" data-act="addroom">+ Aggiungi ambiente</button></div>`)}${textarea('reserveText','Osservazioni generali sugli ambienti, accessi, porte e vincoli')}`}
function roomTabs(){return `<div class="roomnav">${S.roomList.map((r,i)=>`<button class="btn tiny ${roomIndex===i?'active':''}" data-act="roomtab" data-i="${i}">${E(r.name)}</button>`).join('')}</div>`}
function shapeDetail(r){let g=r.geometry, sides=g.points.length, total=g.lengths.reduce((a,b)=>a+num(b),0);return `<p class="muted small">Pareti individuate: <b>${sides}</b> · Sviluppo rilevato: <b>${fmt(total)} m</b>. La stanza irregolare conserva la forma dello schizzo: per definire esattamente gli angoli possono servire diagonali o misure supplementari.</p><div class="rows">${g.lengths.map((L,i)=>`<div class="rowline"><label class="name">Parete ${i+1} ${r.kind==='tonda'?'(arco)':''} · metri</label><input class="mini" inputmode="decimal" type="number" min="0.05" step="0.01" data-wall="${i}" value="${E(L)}"/><span class="small muted">m</span></div>`).join('')}</div>`}
function pageShape(){let r=currentRoom();return `<div class="eyebrow">05 · Rilievo geometrico</div><h1>Schizzo e misure</h1>${roomTabs()}${card('Disegna la forma della stanza',`<div class="banner"><b>Puoi usare il dito.</b> Per una pianta irregolare scegli <b>Vertici a tocchi</b>, tocca ogni angolo e poi <b>Chiudi perimetro</b>. Con <b>Sposta angoli</b> trascini i vertici. In alternativa disegna in un unico gesto.</div><div class="drawingtools"><button class="tool" data-act="preset" data-type="rettangolo">4 pareti</button><button class="tool" data-act="preset" data-type="pentagono">5 pareti</button><button class="tool" data-act="preset" data-type="L">6 pareti / L</button><button class="tool" data-act="preset" data-type="esagono">6 pareti</button><button class="tool" data-act="preset" data-type="tonda">Tonda</button><button class="tool ${mode==='sketch'?'active':''}" data-act="sketchmode">✎ Un solo gesto</button><button class="tool ${mode==='tapvertices'?'active':''}" data-act="tapvertices">◎ Vertici a tocchi</button><button class="tool ${mode==='vertices'?'active':''}" data-act="vertexmode">↔ Sposta angoli</button></div><svg id="plan" class="diagram" viewBox="0 0 900 540" aria-label="Pianta modificabile: tocca o trascina"></svg><div class="drawingtools"><button class="btn primary" data-act="closepolygon" ${polygonDraft.length<3?'disabled':''}>Chiudi perimetro (${polygonDraft.length} vertici)</button><button class="btn" data-act="removevertex" ${!polygonDraft.length?'disabled':''}>Annulla ultimo vertice</button><button class="btn ghost" data-act="adjust">Adatta il disegno alle quote</button><button class="btn" data-act="undosketch">Esci dal disegno</button></div><p class="hint">Dopo il disegno inserisci le misure reali di ogni parete. Una pianta con forma irregolare può richiedere diagonali o angoli per essere quotata con precisione; gli spostamenti manuali invalidano la conferma delle misure finché non vengono ricontrollate.</p>`)}${card('Misure reali',`<div class="twocol">${field('name','Nome ambiente','', 'text',r)}${select('work','Tipo di posa',['Tracce nuove','Impianto esistente','Canalina a vista','Cartongesso','Misto'],r)}</div><div class="threecol">${field('height','Altezza locale (m)','','number',r)}${field('socketH','Prese da terra (m)','','number',r)}${field('switchH','Comandi da terra (m)','','number',r)}</div>${field('boxH','Derivazione da terra (m)','','number',r)}${shapeDetail(r)}<div class="twocol">${field('diag','Diagonale / quota aggiuntiva (m o nota)','','text',r.geometry)}${select('measured','Quote confermate?', ['false','true'],r.geometry)}</div>${textarea('sketchNote','Appunti su angoli, nicchie, curve, porte e misure',r)}`)}</div>`}

const TYPES=[['presa','Presa'],['derivazione','Derivazione'],['interruttore','Interruttore'],['deviatore','Deviatore'],['invertitore','Invertitore'],['luce','Luce'],['tv','Presa TV'],['tv_source','Distribuzione TV'],['dati','Rete dati'],['antincendio','Rivelatore/antincendio']];
function pagePoints(){let r=currentRoom();return `<div class="eyebrow">06 · Dispositivi</div><h1>Posiziona i punti</h1>${roomTabs()}${card('Pianta interattiva',`<div class="banner"><b>Per spostare:</b> scegli «Sposta» e trascina un simbolo. <b>Per collegare:</b> premi «Collega», tocca un simbolo e trascina il dito fino all'altro (oppure tocca i due simboli in successione). I capi della tratta si agganciano ai nodi.</div><div class="drawingtools">${TYPES.map(([v,l])=>`<button class="tool ${mode===v?'active':''}" data-act="tool" data-type="${v}">${l}</button>`).join('')}<button class="tool ${mode==='move'?'active':''}" data-act="tool" data-type="move">↔ Sposta</button><button class="tool ${mode==='connect'?'active':''}" data-act="tool" data-type="connect">↗ Collega due punti</button><button class="tool ${mode==='erase'?'active':''}" data-act="tool" data-type="erase">✕ Elimina</button></div><svg id="plan" class="diagram" viewBox="0 0 900 540" aria-label="Pianta: trascina simboli e crea connessioni"></svg><p class="hint">Il simbolo aggancia la parete più vicina. I percorsi proposti restano indicativi fino alla conferma del tecnico. Tocca «Tratte» nella barra in basso per controllare quantità e sezioni.</p><div class="drawingtools"><button class="btn ghost" data-act="autoroute">Proponi tratte automatiche →</button></div>`)}${card('Punti inseriti',`<div class="tablewrap"><table><thead><tr><th>ID</th><th>Tipo</th><th>Quota m</th><th>Posizione</th></tr></thead><tbody>${r.nodes.map((n,i)=>`<tr><td><b>${E(n.label)}</b></td><td>${E(typeLabel(n.type))}</td><td><input style="max-width:86px" inputmode="decimal" type="number" step=".05" data-z="${i}" value="${E(n.z)}"/></td><td>${n.wall!==undefined?'Parete '+(n.wall+1)+', '+Math.round(n.t*100)+'%':'Interno / soffitto'}</td></tr>`).join('')}</tbody></table></div>${textarea('pointsNote','Note su moduli, serie civile, scatole 503/504/506, comandi, vincoli, dispositivi speciali',r)}`)}<div class="banner warn">Questo è un rilievo preli function routesTable(r){return `<div class="tablewrap routeedit"><table><thead><tr><th>Da → A (nodi)</th><th>Uso</th><th>Metri</th><th>Conduttori unipolari</th><th>Cavo multipolare / coassiale</th><th>Canalizzazione</th><th>ID tubo fisico</th><th></th></tr></thead><tbody>${r.routes.map((rt,i)=>`<tr><td><b>${E(rt.from)} → ${E(rt.to)}</b><br><span class="small muted">${E(rt.label||'')}</span><div class="drawingtools"><select data-route="${i}" data-rfield="fromId">${r.nodes.map(n=>`<option value="${E(n.id)}" ${rt.fromId===n.id?'selected':''}>${E(n.label)}</option>`).join('')}</select><select data-route="${i}" data-rfield="toId">${r.nodes.map(n=>`<option value="${E(n.id)}" ${rt.toId===n.id?'selected':''}>${E(n.label)}</option>`).join('')}</select></div></td><td>${E(rt.use)}</td><td><input type="number" step="0.01" min="0" data-route="${i}" data-rfield="m" value="${E(rt.m)}"/></td><td><input type="number" step="1" min="0" data-route="${i}" data-rfield="wires" value="${E(rt.wires)}"/></td><td><input type="number" step="0.01" min="0" data-route="${i}" data-rfield="cable" value="${E(rt.cable)}"/></td><td><select data-route="${i}" data-rfield="duct">${['Corrugato','Canalina','Tubo rigido','Esistente','Nessuna (solo rilievo)'].map(x=>`<option ${x===rt.duct?'selected':''}>${x}</option>`).join('')}</select></td><td><input type="text" style="max-width:84px" data-route="${i}" data-rfield="physicalId" value="${E(rt.physicalId||rt.id)}" title="Uguale se lo stesso tubo fisico" /></td><td><button class="btn tiny danger" data-act="rmroute" data-i="${i}">✕</button></td></tr>`).join('')}</tbody></table></div>`}
function pageRoutes(){let r=currentRoom(),q=calcRoom(r);return `<div class="eyebrow">07 · Computo</div><h1>Tratte, corrugati e cavi</h1>${roomTabs()}${card('Percorsi fisici e agganci',`<div class="banner">Premi <b>Collega due punti</b>, poi tocca un simbolo e trascina il dito verso un altro simbolo, oppure selezionali uno alla volta. Il connettore segue il dito e si aggancia all'arrivo; quando sposti un simbolo la tratta resta associata. Controlla poi conduttori, tubi e misure.</div><div class="drawingtools"><button class="btn primary" data-act="autoroute">↻ Proponi / ricalcola tratte</button><button class="tool ${mode==='connect'?'active':''}" data-act="tool" data-type="connect">↗ Collega due punti</button><button class="tool ${mode==='move'?'active':''}" data-act="tool" data-type="move">↔ Sposta simboli</button><button class="btn" data-act="confirmroom">${r.confirmed?'✓ Confermate':'Conferma misure tratte'}</button></div><svg id="plan" class="diagram" viewBox="0 0 900 540"></svg><div class="gridstats" style="margin-top:12px"><div class="stat"><strong>${fmt(q.duct)} m</strong><span>Corrugato tracciato</span></div><div class="stat"><strong>${fmt(q.wire)} m</strong><span>Conduttori unipolari</span></div><div class="stat"><strong>${fmt(q.cable)} m</strong><span>Cavo multipolare/coassiale</span></div></div>`)}${card('Dettaglio editabile per tratta',`${routesTable(r)}<div class="drawingtools"><button class="btn ghost" data-act="addroute">+ Aggiungi tratta da elenco</button></div>${textarea('routesNote','Materiali, rientri, derivazioni, quote mancanti, passaggi vietati o ostacoli rilevati',r)}`)}<div class="banner warn">Ogni tratta collega due nodi e ha una lunghezza, un ID tubo fisico e conduttori da verificare. Se due tratte condividono solo parte del percorso, occorre dividerle: un ID identico non è sufficiente a dimostrare una condivisione reale. Alimentazioni, angoli e sezioni mancanti restano da rilevare.</div>`}

function pageUtilities(){let arr=['Rete dati','Domotica','Citofono / videocitofono','Climatizzazione','Allarme intrusione','Rivelazione e allarme incendio','Illuminazione di emergenza','Videosorveglianza','Fotovoltaico / accumulo','Ricarica EV','Impianto esterno','Altro'];return `<div class="eyebrow">08 · Impianti aggiuntivi</div><h1>Utenze speciali</h1>${card('Seleziona le dotazioni',`<div class="choices">${arr.map(a=>`<label class="choice"><input type="checkbox" data-utility="${E(a)}" ${S.otherUsers.includes(a)?'checked':''}>${E(a)}</label>`).join('')}</div>${S.otherUsers.includes('Rivelazione e allarme incendio')?`<div class="banner warn"><b>Antincendio:</b> rilevare centrale, pulsanti manuali, rivelatori, segnalatori, alimentazioni, zone, cavi e percorsi. La classificazione e le prescrizioni di sistema richiedono una valutazione specifica.</div>${textarea('fireNote','Dettagli rivelazione / allarme incendio, zone, riferimenti e documentazione')}`:''}${textarea('finalNote','Altre utenze: potenze, predisposizioni, carichi e note generali')}`)}${card('Esito del sopralluogo',`${select('projectDoc','Documentazione progettuale e verifiche necessarie',['Non verificato','Presenti e visionati','Da acquisire','Non reperiti','Da valutare'])}${textarea('nextActions','Misure, foto, documenti e controlli mancanti prima del preventivo')}`)}`}
function calcRoom(r){let duct=0,wire=0,cable=0,canal=0,pipe=0,unduct=0;const ducts=new Map();for(let rt of r.routes){let m=Math.max(0,num(rt.m)),id=rt.physicalId||rt.id,old=ducts.get(id);if(!old||m>old.m)ducts.set(id,{m,duct:rt.duct});wire+=m*Math.max(0,num(rt.wires));cable+=Math.max(0,num(rt.cable))}for(let value of ducts.values()){if(value.duct==='Corrugato')duct+=value.m;else if(value.duct==='Canalina')canal+=value.m;else if(value.duct==='Tubo rigido')pipe+=value.m;else unduct+=value.m}return{duct,wire,cable,canal,pipe,unduct,total:duct+canal+pipe,ducts:ducts.size}}
function recomputeManual(r,rt){let a=r.nodes.find(n=>n.id===rt.fromId),b=r.nodes.find(n=>n.id===rt.toId);if(!a||!b)return;rt.from=a.label;rt.to=b.label;if(a.wall!==undefined&&b.wall!==undefined){let p=wallPath(r,a,b);rt.path=wallPathRoute(r,a,b,p.dir);rt.m=rnd(p.m+Math.abs(num(a.z)-num(b.z)))}else{let realPer=perimeter(r),pxPer=rawPerimeter(r.geometry.points),scale=pxPer?realPer/pxPer:0;rt.path=[nodePt(r,a),nodePt(r,b)];rt.m=rnd(dist(nodePt(r,a),nodePt(r,b))*scale+Math.abs(num(a.z)-num(b.z)));rt.estimated=true}}

function totals(){let out={duct:0,wire:0,cable:0,canal:0,pipe:0,points:0,routes:0,warnings:[]};for(let r of S.roomList){let q=calcRoom(r);out.duct+=q.duct;out.wire+=q.wire;out.cable+=q.cable;out.canal+=q.canal;out.pipe+=q.pipe;out.points+=r.nodes.length;out.routes+=r.routes.length;if(!r.geometry.measured)out.warnings.push(r.name+': quote pareti non confermate');if(r.kind!=='rettangolo'&&r.kind!=='tonda'&&!r.geometry.diag)out.warnings.push(r.name+': mancano diagonali o angoli per validare la geometria');if(!r.nodes.length)out.warnings.push(r.name+': punti elettrici non inseriti');if(!r.routes.length&&r.nodes.length)out.warnings.push(r.name+': nessuna tratta generata');if(!r.confirmed&&r.routes.length)out.warnings.push(r.name+': tratte proposte non confermate dal tecnico');const seenDuct=new Map();for(let rt of r.routes){let id=rt.physicalId||rt.id,old=seenDuct.get(id);if(old&&(old.duct!==rt.duct||Math.abs(num(old.m)-num(rt.m))>.05))out.warnings.push(r.name+': ID tubo '+id+' condiviso con lunghezze o materiali discordanti');else seenDuct.set(id,rt)}if(r.nodes.filter(n=>n.type==='presa').length&&!r.nodes.some(n=>n.type==='derivazione'))out.warnings.push(r.name+': manca un nodo di derivazione/allacciamento');if(r.nodes.some(n=>n.type==='tv')&&!r.nodes.some(n=>n.type==='tv_source'))out.warnings.push(r.name+': origine distribuzione TV non presente');for(let n of r.nodes){if(n.type==='luce'&&!r.nodes.some(t=>['interruttore','deviatore','invertitore'].includes(t.type)))out.warnings.push(r.name+': punto luce senza comando rilevato')}}if(!S.feedMeasured)out.warnings.push('Distanza alimentazione dal quadro non misurata');if(!S.customer)out.warnings.push('Cliente non inserito');return out}
function pageSummary(){let t=totals(),f=1+Math.max(0,num(S.waste))/100;return `<div class="eyebrow">09 · Rapporto</div><h1>Riepilogo del rilievo</h1><p class="lead">Le quantità sono separate dai dati economici del titolare. Ogni campo, appunto e tratto registrato viene incluso nell'esportazione completa.</p><div class="gridstats"><div class="stat"><strong>${t.points}</strong><span>Dispositivi</span></div><div class="stat"><strong>${t.routes}</strong><span>Tratte</span></div><div class="stat"><strong>${fmt(t.duct*f)} m</strong><span>Corrugato + ${fmt(S.waste)}%</span></div><div class="stat"><strong>${fmt(t.wire*f)} m</strong><span>Conduttori + ${fmt(S.waste)}%</span></div><div class="stat"><strong>${fmt(t.canal*f)} m</strong><span>Canaline + margine</span></div><div class="stat"><strong>${fmt(t.cable*f)} m</strong><span>Cavi multipolari/coassiali + margine</span></div></div>${card('Impostazioni tecniche della stima',`<div class="twocol">${field('waste','Margine per tagli e sfridi (%)','','number')}${field('feedLen','Distanza dal quadro (m)','','number')}</div><label class="checkboxline"><input type="checkbox" data-check="feedMeasured" ${S.feedMeasured?'checked':''}> Alimentazione misurata (non aggiunta ai computi locali: occorre specificarne circuito e contenuto)</label>`)}${card('Qualità e dati mancanti',t.warnings.length?`<div class="banner warn"><b>${t.warnings.length} verifiche ancora aperte</b><ul class="warnlist">${t.warnings.map(w=>`<li>${E(w)}</li>`).join('')}</ul></div>`:`<div class="banner">Non sono stati rilevati campi incompleti evidenti. Restano necessarie le verifiche tecniche.</div>`)}${card('Esportazione completa',`<div class="drawingtools"><button class="btn primary" data-act="xlsx">Esporta Excel completo (.xlsx)</button><button class="btn" data-act="print">Rapporto PDF / Stampa</button><button class="btn" data-act="backup">Backup JSON</button></div><p class="hint">Excel contiene fogli separati per pratica, documenti, ambienti, pareti, punti, tratte, utenze, note e verifiche. Non comprende costi, margini o coefficienti di manodopera.</p>`)}<div class="banner warn">Uso dimostrativo: calcoli geometrici e topologici da validare. Questo strumento non effettua verifiche di sicurezza, dimensionamento, progettazione o certificazione.</div>`}
function typeLabel(type){return TYPES.find(x=>x[0]===type)?.[1]||type}
function nearestWall(r,p){let pts=r.geometry.points,best={dist:Infinity,wall:0,t:0,pt:pts[0]};for(let i=0;i<pts.length;i++){let a=pts[i],b=pts[(i+1)%pts.length],vx=b.x-a.x,vy=b.y-a.y,den=vx*vx+vy*vy,tt=Math.max(0,Math.min(1,den?((p.x-a.x)*vx+(p.y-a.y)*vy)/den:0)),q={x:a.x+tt*vx,y:a.y+tt*vy},d=dist(q,p);if(d<best.dist)best={dist:d,wall:i,t:tt,pt:q}}return best}
function nodePt(r,n){if(n.wall===undefined)return {x:num(n.x),y:num(n.y)};let p=r.geometry.points,a=p[n.wall],b=p[(n.wall+1)%p.length];if(!a||!b)return{x:0,y:0};return{x:a.x+(b.x-a.x)*n.t,y:a.y+(b.y-a.y)*n.t}}
function perimeter(r){return r.geometry.lengths.reduce((a,b)=>a+Math.max(0,num(b)),0)}
function measurePos(r,n){let lengths=r.geometry.lengths,pre=0;for(let i=0;i<(n.wall||0);i++)pre+=num(lengths[i]);return pre+num(lengths[n.wall||0])*num(n.t)}
function wallPath(r,a,b){let L=perimeter(r);if(!L||a.wall===undefined||b.wall===undefined)return{m:0,dir:1};let d=((measurePos(r,b)-measurePos(r,a))%L+L)%L;return{m:Math.min(d,L-d),dir:d<=L/2?1:-1}}
function wallPathRoute(r,a,b,dir){let pts=r.geometry.points,initial=measurePos(r,a),end=measurePos(r,b),L=perimeter(r),path=[nodePt(r,a)];if(!L)return path;let d=dir===1?(end-initial+L)%L:(initial-end+L)%L;let cur=initial;let boundaries=[0],at=0;r.geometry.lengths.forEach(l=>{at+=num(l);boundaries.push(at)});for(let i=0;i<pts.length;i++){let bound=boundaries[i],travel=dir===1?((bound-initial+L)%L):((initial-bound+L)%L);if(travel>1e-6&&travel<d-1e-6)path.push(clone(pts[i]));}path.push(nodePt(r,b));if(dir===1){/* itinerary vertices ordering from start */path.splice(1,path.length-2,...path.slice(1,-1).sort((p,q)=>{function progress(v){let k=pts.findIndex(a=>dist(a,v)<1);return (boundaries[k]-initial+L)%L}return progress(p)-progress(q)}))}else{path.splice(1,path.length-2,...path.slice(1,-1).sort((p,q)=>{function progress(v){let k=pts.findIndex(a=>dist(a,v)<1);return (initial-boundaries[k]+L)%L}return progress(p)-progress(q)}))}return path}
function autoRoutes(r){let nodes=r.nodes,der=nodes.find(n=>n.type==='derivazione');if(!der){r.routes=[];r.confirmed=false;return}let add=(a,b,label,use,wires=0,cable=0,duct='Corrugato',path=[],m=0,estimated=false)=>{let id=uid('T');r.routes.push({id,physicalId:id,from:a.label,to:b.label,fromId:a.id,toId:b.id,label,use,wires,cable,duct,m:rnd(m),path,estimated,confirmed:false})};r.routes=[];let sockets=nodes.filter(n=>n.type==='presa'&&n.wall!==undefined);if(sockets.length){let start=measurePos(r,der),L=perimeter(r),cw=sockets.slice().sort((a,b)=>((measurePos(r,a)-start+L)%L)-((measurePos(r,b)-start+L)%L)),ccw=sockets.slice().sort((a,b)=>((start-measurePos(r,a)+L)%L)-((start-measurePos(r,b)+L)%L)),lenSeq=(arr,d)=>{let sum=0,prev=der;for(let a of arr){let prevPos=measurePos(r,prev),next=measurePos(r,a);sum+=d===1?(next-prevPos+L)%L:(prevPos-next+L)%L;prev=a}return sum};let [arr,dir]=lenSeq(cw,1)<=lenSeq(ccw,-1)?[cw,1]:[ccw,-1];let prev=der;for(let s of arr){let ph=wallPath(r,prev,s);let travel=dir===1?(measurePos(r,s)-measurePos(r,prev)+L)%L:(measurePos(r,prev)-measurePos(r,s)+L)%L;add(prev,s,'Prese collegate in sequenza','prese',3,0,'Corrugato',wallPathRoute(r,prev,s,dir),travel+Math.abs(num(prev.z)-num(s.z)),false);prev=s}}
let lights=nodes.filter(n=>n.type==='luce');let sw=nodes.filter(n=>['interruttore','deviatore','invertitore'].includes(n.type));for(let l of lights){let dp=nodePt(r,der),lp=nodePt(r,l),rawLength=dist(dp,lp),realPer=perimeter(r),pxPer=r.geometry.points.reduce((a,b,i)=>a+dist(b,r.geometry.points[(i+1)%r.geometry.points.length]),0),scale=pxPer?realPer/pxPer:0;let ceil=rawLength*scale;add(der,l,'Soffitto: neutro, PE, ritorno','luce',3,0,'Corrugato',[dp,{x:lp.x,y:dp.y},lp],ceil+Math.abs(num(r.height)-num(der.z)),true)}
if(sw.length===1){let s=sw[0],p=wallPath(r,der,s);add(der,s,'Fase + ritorno al comando','comandi',2,0,'Corrugato',wallPathRoute(r,der,s,p.dir),p.m+Math.abs(num(der.z)-num(s.z)),false)}else if(sw.length>=2){let a=sw[0],b=sw[sw.length-1];let p=wallPath(r,der,a);add(der,a,'Fase comune primo deviatore','comandi',1,0,'Corrugato',wallPathRoute(r,der,a,p.dir),p.m+Math.abs(num(der.z)-num(a.z)),false);let sequence=[a,...sw.slice(1,-1),b];for(let j=0;j<sequence.length-1;j++){let x=sequence[j],y=sequence[j+1],q=wallPath(r,x,y);add(x,y,'2 navette fra comandi','comandi',2,0,'Corrugato',wallPathRoute(r,x,y,q.dir),q.m+Math.abs(num(x.z)-num(y.z)),false)}let pb=wallPath(r,b,der);add(b,der,'Ritorno comandato','comandi',1,0,'Corrugato',wallPathRoute(r,b,der,pb.dir),pb.m+Math.abs(num(b.z)-num(der.z)),false)}
let tv0=nodes.find(n=>n.type==='tv_source'),tv=nodes.filter(n=>n.type==='tv');if(tv0)for(let t of tv){let p=wallPath(r,tv0,t);add(tv0,t,'Distribuzione coassiale separata','tv',0,p.m+Math.abs(num(tv0.z)-num(t.z)),'Corrugato',wallPathRoute(r,tv0,t,p.dir),p.m+Math.abs(num(tv0.z)-num(t.z)),false)}
// Normalizza le tratte condivise fisiche: in questa versione l'operatore le conferma.
r.confirmed=false;save()}
function svgPath(points,closed=true){return points.map((p,i)=>(i?'L':'M')+rnd(p.x,1)+' '+rnd(p.y,1)).join(' ')+(closed?' Z':'')}
const SYMBOLS={presa:'#bf6b16',derivazione:'#64748b',interruttore:'#3d6987',deviatore:'#125b63',invertitore:'#7046aa',luce:'#d7a900',tv:'#1875aa',tv_source:'#147e93',dati:'#1e6f9e',antincendio:'#b7443f'};
function diagramPoint(svg,e){
  // SVG getScreenCTM accounts for the letterboxing caused by preserveAspectRatio on mobile.
  let mat=svg.getScreenCTM();if(mat&&typeof DOMPoint!=='undefined'){let p=new DOMPoint(e.clientX,e.clientY).matrixTransform(mat.inverse());return{x:Math.min(870,Math.max(30,p.x)),y:Math.min(510,Math.max(30,p.y))}}
  let rect=svg.getBoundingClientRect(),scale=Math.min(rect.width/900,rect.height/540),ox=(rect.width-900*scale)/2,oy=(rect.height-540*scale)/2;
  return{x:Math.max(30,Math.min(870,(e.clientX-rect.left-ox)/scale)),y:Math.max(30,Math.min(510,(e.clientY-rect.top-oy)/scale))}
}
function nodeHit(r,pt,svg){let scale=svg.getBoundingClientRect().width/900,thresh=Math.min(77,Math.max(28,23/(scale||.4))),best=-1,d0=Infinity;r.nodes.forEach((n,i)=>{let d=dist(nodePt(r,n),pt);if(d<thresh&&d<d0){best=i;d0=d}});return best}
function cornerHit(r,pt,svg){let scale=svg.getBoundingClientRect().width/900,thresh=Math.min(72,Math.max(25,20/(scale||.4)));let hit=-1,dd=Infinity;r.geometry.points.forEach((p,i)=>{let d=dist(pt,p);if(d<thresh&&d<dd){hit=i;dd=d}});return hit}
function invalidateGeometry(r){r.geometry.measured=false;r.confirmed=false;r.routes.forEach(rt=>{rt.estimated=true;rt.confirmed=false})}
function moveNode(r,i,p){let n=r.nodes[i];if(!n)return;if(n.type==='luce'){n.x=p.x;n.y=p.y}else{let w=nearestWall(r,p);n.wall=w.wall;n.t=rnd(w.t,5)}r.confirmed=false}

function sheetsData(){let t=totals(),rows=[];rows.push(['Pratica',[['Campo','Valore'],...Object.keys(S).filter(k=>!['roomList','otherUsers'].includes(k)).map(k=>[k,typeof S[k]==='boolean'?String(S[k]):S[k]])]]);rows.push(['Documenti',[['Tipo','Stato'],['Di.Co.',S.doc],['Di.Ri.',S.diri],['Documenti messa a terra',S.ground],['Verifiche terra',S.groundChecks],['Progetto/schemi',S.projectDoc],['Annotazioni',S.documentsNote]]]);rows.push(['Ambienti',[['Ambiente','Forma','N. pareti/archi','Altezza m','Prese altezza m','Comandi altezza m','Derivazioni altezza m','Tipo posa','Quote misurate','Diagonale/controllo','Confermato','Note'],...S.roomList.map(r=>[r.name,r.kind,r.geometry.points.length,r.height,r.socketH,r.switchH,r.boxH,r.work,r.geometry.measured?'SI':'NO',r.geometry.diag,r.confirmed?'SI':'NO',r.notes])]]);rows.push(['Pareti',[['Ambiente','Parete','Lunghezza m','X inizio','Y inizio','X fine','Y fine','Origine schizzo'],...S.roomList.flatMap(r=>r.geometry.lengths.map((l,i)=>[r.name,i+1,l,r.geometry.points[i].x,r.geometry.points[i].y,r.geometry.points[(i+1)%r.geometry.points.length].x,r.geometry.points[(i+1)%r.geometry.points.length].y,r.geometry.origin]))]]);rows.push(['Punti',[['Ambiente','ID','Tipo','Parete','Frazione parete','Quota m','X disegno','Y disegno'],...S.roomList.flatMap(r=>r.nodes.map(n=>{let q=nodePt(r,n);return[r.name,n.label,typeLabel(n.type),n.wall===undefined?'Interiore':n.wall+1,n.wall===undefined?'':n.t,n.z,rnd(q.x),rnd(q.y)]}))]]);rows.push(['Tratte',[['Ambiente','ID tratta','ID tubo fisico','Da','A','Funzione','Lunghezza percorso m','Conduttori unipolari n','Metri conduttori','Cavo multipolare/coassiale m','Canalizzazione','Ipotesi'],...S.roomList.flatMap(r=>r.routes.map(rt=>[r.name,rt.id,rt.physicalId||rt.id,rt.from,rt.to,rt.label,rt.m,rt.wires,rnd(rt.m*rt.wires),rt.cable,rt.duct,rt.estimated?'SI':'NO']))]]);rows.push(['Utenze',[['Tipologia','Dettagli'],...S.otherUsers.map(v=>[v,v==='Rivelazione e allarme incendio'?S.fireNote:'']),['Altre not function xesc(v){return String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&apos;')}
function colName(n){let s='';for(n++;n;n=Math.floor((n-1)/26))s=String.fromCharCode(65+(n-1)%26)+s;return s}
function makeXml(rows){let cols=Math.max(...rows.map(x=>x.length),1);let txt=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetViews><sheetView workbookViewId="0"/></sheetViews><sheetFormatPr defaultRowHeight="16"/><cols>${Array.from({length:cols},(_,i)=>`<col min="${i+1}" max="${i+1}" width="${i===0?31:i===1?28:22}" customWidth="1"/>`).join('')}</cols><sheetData>`;rows.forEach((r,i)=>{txt+=`<row r="${i+1}">`;r.forEach((v,j)=>{let ref=colName(j)+(i+1),isNum=typeof v==='number'&&Number.isFinite(v);txt+=`<c r="${ref}" ${isNum?'':'t="inlineStr"'}${i===0?' s="1"':''}>${isNum?`<v>${v}</v>`:`<is><t xml:space="preserve">${xesc(v)}</t></is>`}</c>`});txt+='</row>'});return txt+'</sheetData></worksheet>'}
const te=new TextEncoder();const bytes=x=>typeof x==='string'?te.encode(x):x;
function crc32(a){let c=~0;for(let b of a){c^=b;for(let k=0;k<8;k++)c=c&1?(c>>>1)^0xEDB88320:c>>>1}return(~c)>>>0}
function zip(entries){let local=[],central=[],offset=0;const w16=(view,n)=>view.push(n&255,(n>>8)&255),w32=(view,n)=>view.push(n&255,(n>>8)&255,(n>>16)&255,(n>>24)&255);for(let [name,data] of entries){let nb=bytes(name),db=bytes(data),crc=crc32(db),lh=[];w32(lh,0x04034b50);w16(lh,20);w16(lh,0);w16(lh,0);w16(lh,0);w16(lh,0);w32(lh,crc);w32(lh,db.length);w32(lh,db.length);w16(lh,nb.length);w16(lh,0);local.push(new Uint8Array(lh),nb,db);let ch=[];w32(ch,0x02014b50);w16(ch,20);w16(ch,20);w16(ch,0);w16(ch,0);w16(ch,0);w16(ch,0);w32(ch,crc);w32(ch,db.length);w32(ch,db.length);w16(ch,nb.length);w16(ch,0);w16(ch,0);w16(ch,0);w16(ch,0);w32(ch,0);w32(ch,offset);central.push(new Uint8Array(ch),nb);offset+=lh.length+nb.length+db.length}let cs=central.reduce((a,b)=>a+b.length,0),end=[];w32(end,0x06054b50);w16(end,0);w16(end,0);w16(end,entries.length);w16(end,entries.length);w32(end,cs);w32(end,offset);w16(end,0);return new Blob([...local,...central,new Uint8Array(end)],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'})}
function makeExcel(){let data=sheetsData(),entries=[];let ct='<?xml version="1.0" encoding="UTF-8"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>';data.forEach((_,i)=>ct+=`<Override PartName="/xl/worksheets/sheet${i+1}.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>`);entries.push(['[Content_Types].xml',ct+'</Types>']);entries.push(['_rels/.rels','<?xml version="1.0" encoding="UTF-8"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>']);entries.push(['xl/workbook.xml',`<?xml version="1.0" encoding="UTF-8"?><workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets>${data.map(([name],i)=>`<sheet name="${xesc(name)}" sheetId="${i+1}" r:id="rId${i+1}"/>`).join('')}</sheets></workbook>`]);entries.push(['xl/_rels/workbook.xml.rels',`<?xml version="1.0" encoding="UTF-8"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">${data.map((_,i)=>`<Relationship Id="rId${i+1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet${i+1}.xml"/>`).join('')}<Relationship Id="rId${data.length+1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>`]);entries.push(['xl/st function printPairs(obj){return `<table>${Object.entries(obj).map(([k,v])=>`<tr><td style="width:35%"><b>${E(k)}</b></td><td>${E(Array.isArray(v)?v.join(', '):v)}</td></tr>`).join('')}</table>`}
function roomSvgImage(r){let sv=document.createElementNS('http://www.w3.org/2000/svg','svg');sv.setAttribute('xmlns','http://www.w3.org/2000/svg');sv.setAttribute('viewBox','0 0 900 540');let pts=r.geometry.points;sv.innerHTML=`<rect width="900" height="540" fill="white"/><path d="${svgPath(pts)}" fill="#fff" stroke="#333" stroke-width="7"/>`+r.routes.map(rt=>`<path d="${svgPath(rt.path||[],false)}" fill="none" stroke="${rt.use==='prese'?'#c26a18':'#226b93'}" stroke-width="4" stroke-dasharray="7 4"/>`).join('')+pts.map((p,i)=>{let b=pts[(i+1)%pts.length];return `<text x="${(p.x+b.x)/2}" y="${(p.y+b.y)/2-10}" font-size="14" text-anchor="middle">${fmt(r.geometry.lengths[i])} m</text>`}).join('')+r.nodes.map(n=>{let p=nodePt(r,n);return `<circle cx="${p.x}" cy="${p.y}" r="9" fill="${SYMBOLS[n.type]||'#444'}"/><text x="${p.x+11}" y="${p.y-11}" font-size="14">${E(n.label)}</text>`}).join('');return 'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(new XMLSerializer().serializeToString(sv))}

→ ${E(rt.to)} · ${E(rt.label)} · ${E(rt.physicalId||rt.id)}</td><td>${fmt(num(rt.m))}</td><td>${num(rt.wires)}</td><td>${fmt(num(rt.m)*num(rt.wires))}</td><td>${fmt(num(rt.cable))}</td><td>${E(rt.duct)}</td></tr>`).join('')+'</table>'+printPairs({'Corrugato netto m':fmt(q.duct),'Canalina netta m':fmt(q.canal),'Tubo rigido netto m':fmt(q.pipe),'Conduttori unipolari netti m':fmt(q.wire),'Cavi multipolari/coassiali m':fmt(q.cable)})+'</div>'}s+='<div class="page"><h2>4. Utenze e annotazioni</h2>'+printPairs({'Utenze speciali':S.otherUsers,'Antincendio':S.fireNote,'Altre note':S.finalNote,'Osservazioni generali':S.reserveText,'Dati mancanti / azioni':S.nextActions});s+='<h2>5. Riepilogo tecnico</h2>'+printPairs({Dispositivi:t.points,Tratte:t.routes,'Corrugato netto m':fmt(t.duct),'Canalina netta m':fmt(t.canal),'Conduttori singoli m':fmt(t.wire),'Cavi speciali m':fmt(t.cable),'Margine suggerito %':S.waste,'Alimentazione quadro':S.feedMeasured?S.feedLen+' m, da computare per circuiti':'Non misurata'});s+='<h3>Verifiche non concluse</h3><ul>'+t.warnings.map(w=>`<li>${E(w)}</li>`).join('')+'</ul></div>';$('report').innerHTML=s}
