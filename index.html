<style>

*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.45;-webkit-font-smoothing:antialiased;font-size:16px}
button,input,select,textarea{font:inherit}button{cursor:pointer}button:disabled{opacity:.45;cursor:default}.wrap{max-width:970px;margin:0 auto;padding:0 22px}.app-top{position:sticky;top:0;z-index:15;background:var(--bg);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}.toprow{display:flex;align-items:center;justify-content:space-between;gap:14px;padding-top:13px;padding-bottom:10px}.brand{display:flex;gap:10px;align-items:center;font-size:13px;font-weight:850;letter-spacing:.065em;text-transform:uppercase;color:var(--teal)}.brandmark{width:33px;height:33px;border-radius:9px;background:var(--teal);color:var(--bg);display:grid;place-items:center;font-weight:900;font-size:19px}.muted{color:var(--muted)}.small{font-size:13px}.tiny{font-size:11px}.toolbar{display:flex;align-items:center;gap:7px}.iconbtn,.btn{border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:10px;padding:10px 13px;font-size:14px;font-weight:650}.iconbtn{padding:7px 10px;white-space:nowrap}.btn:hover,.iconbtn:hover{border-color:var(--teal)}.btn.primary{background:var(--teal);border-color:var(--teal);color:var(--bg)}.btn.secondary{border-color:var(--teal);color:var(--teal)}.btn.danger{color:var(--red);border-color:var(--red)}.btn.full{width:100%}.btn.sm{padding:7px 10px;font-size:12px}.pill{display:inline-flex;border-radius:999px;align-items:center;padding:5px 10px;background:var(--teal2);color:var(--teal);font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.05em}.pill.warn{background:var(--gold2);color:var(--gold)}.progressmeta{display:flex;justify-content:space-between;color:var(--muted);font-size:12px;gap:10px;margin-bottom:7px}.bar{height:4px;background:var(--line);overflow:hidden;border-radius:5px}.bar>b{display:block;height:100%;background:var(--teal);transition:width .2s}
main{padding-top:28px;padding-bottom:120px}.eyebrow{font-weight:800;color:var(--teal);font-size:12px;letter-spacing:.12em;text-transform:uppercase}.page-title{font-weight:900;letter-spacing:-.04em;line-height:1.12;font-size:clamp(30px,4.8vw,43px);margin:7px 0 9px;max-width:800px}.lede{margin:0 0 23px;color:var(--muted);max-width:780px;font-size:15px}.card{background:var(--paper);border:1px solid var(--line);border-radius:15px;padding:20px;margin-bottom:15px;box-shadow:var(--shadow)}.card h2,.card h3{font-size:17px;line-height:1.3;letter-spacing:-.02em;margin:0 0 13px}.card .sub{font-size:13px;color:var(--muted);margin:-6px 0 15px}.field{margin-bottom:14px}.field:last-child{margin-bottom:0}.field label,.field>label{display:block;margin-bottom:5px;font-size:13px;font-weight:750;color:var(--muted)}input:not([type=radio]):not([type=checkbox]):not([type=file]),select,textarea{width:100%;min-width:0;background:var(--paper);border:1px solid var(--line);color:var(--ink);border-radius:9px;padding:11px 12px;font-size:16px;outline:none}input:focus,select:focus,textarea:focus{border-color:var(--teal);outline:2px solid var(--teal2)}textarea{min-height:84px;resize:vertical}.cols2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.cols3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.choicegrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.choicegrid.three{grid-template-columns:repeat(3,minmax(0,1fr))}.choice{display:flex;gap:9px;align-items:center;background:var(--paper);border:1px solid var(--line);padding:11px 12px;border-radius:10px;font-size:14px;cursor:pointer;min-height:47px}.choice:has(input:checked){background:var(--teal2);border-color:var(--teal);font-weight:700}.choice input{accent-color:var(--teal);width:17px;height:17px;flex:none}.callout{padding:13px 15px;border-radius:10px;background:var(--teal2);border:1px solid var(--line);font-size:13px;margin:14px 0;color:var(--ink)}.callout.warn{background:var(--gold2);border-color:var(--gold)}.callout.alert{background:var(--red2);border-color:var(--red)}.tag{display:inline-block;border-radius:5px;border:1px solid var(--line);font-size:11px;padding:2px 7px;color:var(--muted)}.seprow{display:flex;gap:10px;justify-content:space-between;align-items:center;flex-wrap:wrap}.statgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.stat{padding:15px;background:var(--paper);border:1px solid var(--line);border-radius:12px}.stat .val{font-weight:900;font-size:clamp(20px,4vw,31px);letter-spacing:-.03em}.stat .lbl{color:var(--muted);font-size:12px}.tablewrap{overflow:auto;max-width:100%}table{border-collapse:collapse;width:100%;font-size:13px}th,td{padding:9px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}th{font-size:12px;color:var(--muted);font-weight:800}td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}.checklist{list-style:none;margin:0;padding:0}.checklist li{padding:8px 0 8px 24px;border-bottom:1px solid var(--line);position:relative;font-size:14px}.checklist li:before{content:'!';position:absolute;left:0;top:8px;background:var(--gold2);color:var(--gold);font-weight:900;border-radius:4px;width:16px;text-align:center}.checks{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.checkrow{display:flex;gap:9px;align-items:flex-start;font-size:14px}.checkrow input{width:19px;height:19px;accent-color:var(--teal);flex:none;margin-top:1px}.navouter{position:fixed;bottom:0;left:0;right:0;z-index:12;background:var(--bg);border-top:1px solid var(--line);padding:11px 0 calc(11px + env(safe-area-inset-bottom,0px))}.navinner{display:flex;gap:10px;align-items:center;justify-content:space-between}.navinner .btn.primary{min-width:140px}.roomcanvas{width:100%;aspect-ratio:4/3;display:block;background:#fff;border:1px solid #ccd2cf;border-radius:10px;touch-action:none;cursor:crosshair;max-height:430px}.toolrow{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 12px}.toolbtn{border:1px solid var(--line);background:var(--paper);color:var(--ink);padding:7px 10px;border-radius:8px;font-size:12px;font-weight:700}.toolbtn.active{background:var(--teal2);border-color:var(--teal);color:var(--teal)}.filelabel{display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--teal);border-radius:10px;color:var(--teal);padding:10px 13px;font-size:14px;font-weight:700;cursor:pointer}.filelabel input{display:none}.actionrow{display:flex;gap:9px;flex-wrap:wrap;margin:12px 0}.twocol{display:grid;grid-template-columns:1.2fr .8fr;gap:16px}.exampleline{border-left:3px solid var(--teal);padding:9px 0 9px 13px;margin:10px 0}.footnote{font-size:12px;color:var(--muted)}.notice{color:var(--red);font-weight:650}.print-report{display:none}hr{border:0;border-top:1px solid var(--line);margin:18px 0}.strong{font-weight:800}.mono{font-variant-numeric:tabular-nums;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}a{color:var(--teal)}
@media(max-width:670px){.wrap{padding-left:16px;padding-right:16px}.card{padding:15px;border-radius:12px}.toprow{padding-top:9px}.brand{letter-spacing:0;font-size:11px}.brandmark{width:29px;height:29px;font-size:16px}.toolbar{gap:4px}.iconbtn{font-size:11px;padding:8px}.cols3{grid-template-columns:1fr 1fr}.statgrid{grid-template-columns:1fr 1fr}.twocol{grid-template-columns:1fr}.choicegrid.three{grid-template-columns:1fr 1fr}.navinner .btn.primary{min-width:125px}main{padding-top:19px}.page-title{font-size:31px}.roomcanvas{aspect-ratio:1/1}}
@media(max-width:420px){.choicegrid,.checks{grid-template-columns:1fr}.cols2{grid-template-columns:1fr}.choicegrid.three{grid-template-columns:1fr}.toolbar .optional{display:none}}
@media print{@page{size:A4;margin:13mm}body{background:white;color:#111;font:11px/1.35 Arial,sans-serif}.app-top,.app-body,.navouter{display:none!important}.print-report{display:block!important}.print-report h1{font-size:21px;margin:0 0 8px}.print-report h2{font-size:15px;color:#155e68;border-bottom:1px solid #aaa;padding-bottom:4px;margin:19px 0 8px;page-break-after:avoid}.print-report table{font-size:10px}.print-report th,.print-report td{padding:5px;border-bottom:1px solid #bbb}.print-report .pr-room{page-break-inside:avoid}.print-report img{max-width:100%;max-height:95mm;object-fit:contain;border:1px solid #bbb}.print-report .pr-warning{border-left:3px solid #a46d1c;padding-left:7px;margin:5px 0}.print-report .pagebreak{break-before:page}}

<body>
<div class="app-body">
 <div class="app-top"><div class="wrap">
  <div class="toprow"><div class="brand"><span class="brandmark">ϟ</span><span>Rilievo Elettrico<br><span class="muted" style="font-weight:500;letter-spacing:0;text-transform:none">Demo guidata · v1.1</span></span></div>
   <div class="toolbar"><span class="pill optional">Solo demo</span><button class="iconbtn" id="summary-btn" type="button">Riepilogo</button><button class="iconbtn" id="theme-btn" title="Cambia tema" type="button">◐</button></div></div>

 </div></div>

<script>
(function(){'use strict';
const KEY='reg_demo_v1',VERSION=1;
const initial=()=>({version:VERSION,practice:'',date:new Date().toISOString().slice(0,10),technician:'',customer:'',phone:'',email:'',address:'',city:'',site:'',kind:'Appartamento',status:'Nuova costruzione',work:'Impianto nuovo',request:'',floors:1,surface:'',rooms:[newRoom(1)],existingDocs:{dico:'Non verificata',diri:'Non verificata',dicoDate:'',issuer:'',coverage:'',updates:'Da verificare',annex:[],notes:''},earth:{paper:'Non verificata',pe:'Da verificare',equip:'Da verificare',test:'Non eseguite',report:'Non visionato',notes:''},supply:{phase:'Monofase',kw:'',counter:'',dist:'',panel:'',panelState:'Da verificare',circuits:'',dif:'Da verificare',spd:'Da verificare',ground:'Da verificare',notes:''},special:[],ev:{kw:'',dist:'',notes:''},pv:{roof:'',surface:'',orient:'',shadows:'',fromRoof:'',toBoard:'',notes:''},works:{occupied:false,access:'',restores:[],critical:'',notes:'',testRequired:'Da definire',projectRequired:'Da valutare dal professionista',dpr:'Non applicabile / da valutare',staff:2},rates:{tracePerPoint:0.10,boxPerPoint:0.18,conduitPerM:0.11,wirePerM:0.08,connectPerPoint:0.23,wallPerM:0.65,setup:1.5,tests:2,panelHours:0,contingency:10,wireWaste:10,conduitWaste:10,labourEuro:38},approval:'Dati preliminari: da verificare',finalNotes:'',theme:'light'});
function newRoom(i){return {name:'Ambiente '+i,shapeL:'',shapeW:'',height:'2.70',socketH:'0.40',switchH:'1.20',boxH:'2.40',doorCount:'1',windowCount:'',light:0,switches:0,sockets:0,tv:0,data:0,special:0,installation:'Pareti grezze',measure:'Da misurare',routeSockets:'',routeLights:'',routeSwitches:'',routeTv:'',routeData:'',feedSocket:'',feedLight:'',wallChase:'',notes:'',drawing:[]}}
function demo(){let s=initial();Object.assign(s,{practice:'DEMO-4X4-001',technician:'Tecnico dimostrativo',date:'2026-10-14',customer:'Cliente dimostrativo',phone:'',address:'Via Esempio 10',city:'Milano',kind:'Appartamento',status:'Immobile esistente',work:'Rifacimento completo',surface:16,request:'Rifacimento di una stanza 4 × 4 m: 7 prese, 1 TV, 1 luce, 1 interruttore.',existingDocs:{dico:'Non reperibile',diri:'Non verificata',dicoDate:'',issuer:'',coverage:'',updates:'Da verificare',annex:[],notes:'Richiedere documentazione prima della conferma del preventivo.'},supply:{phase:'Monofase',kw:'3',counter:'Contatore condominiale',dist:'',panel:'Ingresso appartamento',panelState:'Da verificare',circuits:'Da definire',dif:'Da verificare',spd:'Da verificare',ground:'Da verificare',notes:'Alimentazione dal quadro non compresa nei metri della stanza.'},works:{...s.works,access:'Normale',staff:2},finalNotes:'Esempio dimostrativo. Verificare percorsi, murature, cavi e dimensionamento prima dell’offerta.'});
 s.rooms=[{...newRoom(1),name:'Camera 4 × 4 m',shapeL:'4',shapeW:'4',height:'2.70',socketH:'0.40',switchH:'1.20',boxH:'2.40',doorCount:'1',light:1,switches:1,sockets:7,tv:1,installation:'Pareti grezze',measure:'Tratte ipotizzate',routeSockets:'15.6',routeLights:'3',routeSwitches:'1.2',routeTv:'6.2',routeData:'',feedSocket:'',feedLight:'',wallChase:'',notes:'7 prese: 2 su tre pareti e 1 sulla quarta. 1 presa TV. Le alimentazioni dal quadro sono da misurare.',drawing:[{t:'porta',x:.12,y:.92},{t:'scatola',x:.20,y:.78},{t:'interruttore',x:.20,y:.91},{t:'luce',x:.5,y:.5},{t:'presa',x:.39,y:.9},{t:'presa',x:.72,y:.9},{t:'presa',x:.9,y:.65},{t:'presa',x:.9,y:.33},{t:'presa',x:.38,y:.1},{t:'presa',x:.72,y:.1},{t:'presa',x:.1,y:.65},{t:'tv',x:.1,y:.33}]}];return s;}
let S=load(),current='intro',roomTool='presa',drawingPointer=null;
function load(){try{let x=JSON.parse(localStorage.getItem(KEY));if(x&&x.version===VERSION&&Array.isArray(x.rooms))return {...initial(),...x}}catch(e){}return initial()}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));document.getElementById('saved-note').textContent='Salvato sul dispositivo'}catch(e){document.getElementById('saved-note').textContent='Memoria piena: esporta JSON'}}
function fmt(n,dec=1){return Number(n||0).toLocaleString('it-IT',{maximumFractionDigits:dec})}
function euro(n){return Number(n||0).toLocaleString('it-IT',{style:'currency',currency:'EUR'})}
function num(x){if(x===null||x===undefined||x==='')return null;let n=Number(String(x).replace(',','.'));return Number.isFinite(n)&&n>=0?n:null}
function asn(x){return num(x)||0}
function E(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
const RS=['Non verificata','Presente e visionata','Presente non visionata','Non reperibile','Non applicabile'];
function fld(name,label,opts={}){let key=opts.room!==undefined?'rooms.'+opts.room+'.'+name:opts.path||name;let v=opts.room!==undefined?S.rooms[opts.room][name]:get(key);let type=opts.type||'text';let other=opts.placeholder?` placeholder="${E(opts.placeholder)}"`:'';let value=E(v??'');let hint=opts.help?`<div class="footnote" style="margin-top:5px">${E(opts.help)}</div>`:'';let el=type==='textarea'?`<textarea data-key="${E(key)}" id="f_${E(key)}"${other}>${value}</textarea>`:type==='select'?`<select data-key="${E(key)}" id="f_${E(key)}">${(opts.options||[]).map(a=>`<option value="${E(a)}" ${a===v?'selected':''}>${E(a)}</option>`).join('')}</select>`:`<input data-key="${E(key)}" id="f_${E(key)}" type="${type}" value="${value}"${other}${type==='number'?' min="0" step="any" inputmode="decimal"':''}>`;return `<div class="field"><label for="f_${E(key)}">${E(label)}</label>${el}${hint}</div>`}
function group(path,title,items,multiple=false){let selected=get(path);return `<div class="field"><label>${E(title)}</label><div class="choicegrid">${items.map(a=>`<label class="choice"><input data-key="${E(path)}" ${multiple?'data-multi="1"':''} type="${multiple?'checkbox':'radio'}" name="${E(path)}" value="${E(a)}" ${multiple?(Array.isArray(selected)&&selected.includes(a)?'checked':''):(selected===a?'checked':'')}><span>${E(a)}</span></label>`).join('')}</div></div>`}
function get(path){return path.split('.').reduce((o,k)=>o==null?undefined:o[k],S)}
function set(path,value){let a=path.split('.'),o=S;for(let i=0;i<a.length-1;i++){if(o[a[i]]==null)o[a[i]]={};o=o[a[i]]}o[a[a.length-1]]=value}
const C=(title,children,subtitle='')=>`<section class="card"><h2>${title}</h2>${subtitle?`<p class="sub">${subtitle}</p>`:''}${children}</section>`;
function steps(){let arr=[{id:'intro',label:'Presentazione'},{id:'client',label:'Cliente'},{id:'site',label:'Immobile'}];if(S.status!=='Nuova costruzione')arr.push({id:'docs',label:'Documenti esistenti'},{id:'earth',label:'Terra e verifiche'});arr.push({id:'board',label:'Fornitura e quadro'});S.rooms.forEach((r,i)=>arr.push({id:'room'+i,label:`Ambiente ${i+1}/${S.rooms.length}`}));arr.push({id:'special',label:'Utenze speciali'});if(S.special.includes('Ricarica veicoli elettrici'))arr.push({id:'ev',label:'Ricarica EV'});if(S.special.includes('Fotovoltaico o accumulo'))arr.push({id:'pv',label:'Fotovoltaico'});arr.push({id:'works',label:'Opere e cantiere'},{id:'rates',label:'Tempi e coefficienti'},{id:'result',label:'Riepilogo'});return arr}
function pageInfo(id){if(id==='intro')return ['Un sopralluogo più intelligente','Prototipo dimostrativo senza server: il tecnico rileva i dati, il titolare esamina i calcoli e le informazioni mancanti.'];if(id==='client')return ['Cliente e sopralluogo','Chi commissiona i lavori e chi esegue il rilievo.'];if(id==='site')return ['Tipo di immobile','Le domande successive cambiano in base alla situazione del fabbricato.'];if(id==='docs')return ['Documentazione esistente','Rilievo documentale: non costituisce una verifica di conformità.'];if(id==='earth')return ['Impianto di terra','Distinguiamo documenti disponibili, osservazioni e misure strumentali non eseguite.'];if(id==='board')return ['Fornitura e quadro','Dati necessari per il progetto, senza presumere sezioni o protezioni corrette.'];if(id.startsWith('room'))return [`Ambiente ${Number(id.slice(4))+1} di ${S.rooms.length}`,'Misure reali, quantità, percorsi e schizzo grafico. I metri si inseriscono per tratta, non con medie per presa.'];if(id==='special')return ['Utenze particolari','Si aprono soltanto le schede pertinenti.'];if(id==='ev')return ['Ricarica veicolo elettrico','Rilievo preliminare: protezioni e dimensionamento richiedono la valutazione professionale.'];if(id==='pv')return ['Fotovoltaico e accumulo','Scheda preliminare: non è un progetto di impianto fotovoltaico.'];if(id==='works')return ['Opere accessorie','Qui emergono i veri costi nascosti di una ristrutturazione.'];if(id==='rates')return ['Regole della manodopera','Coefficienti di esempio: il titolare potrà personalizzarli sui propri consuntivi.'];return ['Riepilogo per il titolare','Dati rilevati, stime trasparenti, criticità e materiali da confermare.']}
function intro(){return `<div class="twocol"><div>${C('Da mostrare all’elettricista',`<p><b>Problema:</b> un preventivo impreciso nasce spesso da un sopralluogo incompleto.</p><p><b>Soluzione proposta:</b> domande guidate, rilievo stanza per stanza, schizzo su schermo, calcolo per tratti distinti e registro delle informazioni mancanti.</p><p><b>Controllo umano:</b> il tecnico decide materiali, dimensionamento, conformità e preventivo finale.</p><div class="callout warn">Questa è una prova: quote e tempi di esempio sono ipotetici. I dati non misurati o non verificati vengono segnalati nel riepilogo.</div><div class="actionrow"><button class="btn primary" data-act="demo">Carica esempio stanza 4 × 4</button><button class="btn" data-act="blank">Nuovo rilievo vuoto</button></div><p class="footnote">L'esempio è già compilato: 7 prese elettriche, 1 presa TV, 1 luce, 1 interruttore, un disegno e metri indicativi.</p>`,`Una dimostrazione concreta, non una promessa di automazione totale.`)}</div><div>${C('Cosa può vedere subito',`<div class="exampleline"><b>1. Raccoglie informazioni</b><div class="small muted">Con domande condizionali, documenti, quadro e terreno di posa.</div></div><div class="exampleline"><b>2. Disegna la stanza</b><div class="small muted">Con il dito su iPhone oppure con il mouse sul Mac.</div></div><div class="exampleline"><b>3. Calcola senza nascondere le ipotesi</b><div class="small muted">Percorsi misurati o stimati, metri conduttori e ore-uomo.</div></div><div class="exampleline"><b>4. Segnala ciò che manca</b><div class="small muted">Non inventa metri, documenti o sezioni dei cavi.</div></div>`)}${C('Funziona senza account',`<p class="small">Tutto è contenuto in un file HTML, senza librerie o connessioni obbligatorie. In questa fase non viene usata alcuna AI: le domande e i conti sono basati su regole programmate. I dati restano sul dispositivo/browser usato. È possibile esportare e importare un backup JSON.</p><span class="pill warn">Demo · non vali function calc(){let sums={points:0,light:0,lights:0,sockets:0,switches:0,tv:0,data:0,special:0,elRoute:0,tvRoute:0,dataRoute:0,conduit:0,elWires:0,chases:0,rooms:[],unknown:[],measured:0};
 for(let i=0;i<S.rooms.length;i++){let r=S.rooms[i],p={sockets:asn(r.sockets),light:asn(r.light),switches:asn(r.switches),tv:asn(r.tv),data:asn(r.data),special:asn(r.special)};let pt=Object.values(p).reduce((a,b)=>a+b,0);for(let k of Object.keys(p))sums[k]+=p[k];sums.points+=pt;sums.lights=sums.light;let cats=[['routeSockets',p.sockets,'Circuito prese',3],['routeLights',p.light,'Punto luce',3],['routeSwitches',p.switches,'Comando luce',2],['routeTv',p.tv,'TV',0],['routeData',p.data,'Dati LAN',0],['feedSocket',p.sockets,'Alimentazione prese dal quadro',3],['feedLight',p.light,'Alimentazione luce dal quadro',3]];
 let routes=[],roomConduit=0,roomWire=0,roomElectrical=0;
 for(let [k,count,label,conductors] of cats){if(count===0)continue;let val=num(r[k]);if(val===null){sums.unknown.push(`Ambiente ${i+1} (${r.name}): ${label.toLowerCase()} da misurare`);continue}let m=val;roomConduit+=m;routes.push({label,m,conductors});if(conductors){roomWire+=m*conductors;roomElectrical+=m;sums.elRoute+=m}else if(k==='routeTv')sums.tvRoute+=m;else sums.dataRoute+=m;sums.measured++}
 let wall=num(r.wallChase);if(r.installation==='Tracce su pareti finite'&&wall===null)sums.unknown.push(`${r.name}: metri di nuove tracce non indicati`);sums.chases+=wall||0;sums.conduit+=roomConduit;sums.elWires+=roomWire;sums.rooms.push({room:r,idx:i,points:pt,conduit:roomConduit,wires:roomWire,elroute:roomElectrical,routes,wall})}
 let q=S.rates,working={tracing:sums.points*asn(q.tracePerPoint),boxes:sums.points*asn(q.boxPerPoint),conduit:sums.conduit*asn(q.conduitPerM),wiring:sums.elRoute*asn(q.wirePerM),connection:sums.points*asn(q.connectPerPoint),chases:sums.chases*asn(q.wallPerM),setup:asn(q.setup),testing:asn(q.tests),panel:asn(q.panelHours)};
 let raw=Object.values(working).reduce((a,b)=>a+b,0),reserve=raw*asn(q.contingency)/100,hours=raw+reserve,staff=Math.max(1,asn(S.works.staff));
 let warning=[...sums.unknown];if(S.status==='Immobile esistente'){if(S.existingDocs.dico!=='Presente e visionata')warning.push('Di.Co. impianto esistente non visionata o non disponibile.');if(S.earth.paper==='Non verificata'||S.earth.paper==='Non reperibile')warning.push('Documentazione relativa alla messa a terra non verificata.');if(S.earth.test==='Non eseguite')warning.push('Nessuna prova strumentale eseguita in questa demo.');}if(sums.special>0)warning.push('Punti speciali: tratte e linee dedicate escluse dal computo automatico.');if(!S.supply.kw)warning.push('Potenza di fornitura da confermare.');if(!S.supply.circuits)warning.push('Circuiti, protezioni e sezioni da definire in fase tecnica.');if(S.special.includes('Fotovoltaico o accumulo')||S.special.includes('Ricarica veicoli elettrici'))warning.push('Utenze speciali escluse dalla stima automatica di materiali e tempi.');if(!S.customer)warning.push('Committente da indicare.');
 if(S.rooms.some(r=>r.measure==='Tratte ipotizzate'))warning.push('Una o più stanze contengono lunghezze ipotizzate, non misurate: confermare prima del preventivo.');
 if(S.rooms.some(r=>r.measure==='Da misurare'))warning.push('Una o più stanze non hanno il rilievo metrico confermato.');
 if(S.rooms.some(r=>asn(r.tv)>0))warning.push('Distribuzione TV a monte, eventuali amplificatori e collegamenti comuni non inclusi nella lunghezza della tratta locale.');
 if(S.rooms.some(r=>asn(r.data)>0))warning.push('Punti rete: collegamenti a router/armadio dati e topologia da verificare.');
 return {...sums,working,raw,reserve,hours,staff,crewHours:hours/staff,warnings:warning,conduitWaste:sums.conduit*(1+asn(q.conduitWaste)/100),wireWaste:sums.elWires*(1+asn(q.wireWaste)/100),coax:sums.tvRoute*(1+asn(q.wireWaste)/100),dataCable:sums.dataRoute*(1+asn(q.wireWaste)/100),cost:hours*asn(q.labourEuro)}}
function detailsTable(t){let rows=[['Preparazione sopralluogo / cantiere',t.working.setup],['Tracciatura',t.working.tracing],['Scatole e supporti',t.working.boxes],['Posa corrugati',t.working.conduit],['Infilaggio conduttori',t.working.wiring],['Collegamenti',t.working.connection],['Tracce edili',t.working.chases],['Quadro (se previsto)',t.working.panel],['Verifiche e riordino',t.working.testing],['Riserva ore '+fmt(S.rates.contingency)+'%',t.reserve]];return `<div class="tablewrap"><table><thead><tr><th>Attività</th><th class="num">Ore-uomo</th></tr></thead><tbody>${rows.map(([a,b])=>`<tr><td>${E(a)}</td><td class="num">${fmt(b,2)} h</td></tr>`).join('')}<tr><td><b>Totale</b></td><td class="num"><b>${fmt(t.hours,2)} h</b></td></tr></tbody></table></div>`}

 ${C('Dettaglio delle tratte',`<div class="tablewrap"><table><thead><tr><th>Ambiente / tratta</th><th class="num">Metri</th><th>Assunzione</th></tr></thead><tbody>${t.rooms.map(x=>x.routes.map(y=>`<tr><td>${E(x.room.name)} · ${E(y.label)}</td><td class="num">${fmt(y.m)} m</td><td>${y.conductors?`${y.conductors} conduttori*`:'Cavo dedicato'}</td></tr>`).join('')).join('')}</tbody></table></div><p class="footnote">* I conduttori sono un'ipotesi per stimare quantità, non un dimensionamento; i metri delle tratte possono essere solo ipotizzati.</p>`)}
 ${C(`Dati mancanti o non verificati (${t.warnings.length})`,t.warnings.length?`<ul class="checklist">${t.warnings.map(x=>`<li>${E(x)}</li>`).join('')}</ul>`:'<p>Nessuna mancanza segnalata automaticamente. Resta necessaria la verifica tecnica.</p>','Il sistema segnala criticità anziché sostituire dati ignoti con quantità inventate.')}
 ${C('Chiusura della dimostrazione',`${group('approval','Stato di valutazione',['Dati preliminari: da verificare','Richiedere integrazioni','Pronto per verifica tecnica del titolare'])}${fld('finalNotes','Note finali ed esclusioni',{type:'textarea'})}<div class="actionrow"><button class="btn primary" data-act="print">Stampa / salva PDF</button><button class="btn secondary" data-act="csv">Esporta CSV per Excel</button><button class="btn" data-act="json">Backup JSON</button><label class="filelabel">Importa backup JSON<input type="file" id="import-json" accept=".json,application/json"></label></div><div class="actionrow"><button class="btn danger" data-act="reset">Nuova pratica (azzera dati)</button></div><div class="callout warn">Questa è una <b>dimostrazione</b> di raccolta dati e preventivazione assistita. Nessun calcolo certifica la sicurezza dell'impianto né sostituisce il progetto o le verifiche di personale abilitato.</div>`)} `}
function drawLayout(ctx,w,h,room,drawing){ctx.clearRect(0,0,w,h);ctx.fillStyle='#fff';ctx.fillRect(0,0,w,h);ctx.strokeStyle='#e9eeee';ctx.lineWidth=1;let box={x:44,y:35,w:w-88,h:h-85};let minDim=Math.max(.1,Math.min(asn(room.shapeL)||4,asn(room.shapeW)||4));let cols=Math.max(4,Math.min(30,Math.round((asn(room.shapeL)||4)*4))),rows=Math.max(4,Math.min(30,Math.round((asn(room.shapeW)||4)*4)));for(let i=1;i<cols;i++){let x=box.x+box.w*i/cols;ctx.beginPath();ctx.moveTo(x,box.y);ctx.lineTo(x,box.y+box.h);ctx.stroke()}for(let i=1;i<rows;i++){let y=box.y+box.h*i/rows;ctx.beginPath();ctx.moveTo(box.x,y);ctx.lineTo(box.x+box.w,y);ctx.stroke()}ctx.lineWidth=5;ctx.strokeStyle='#31464c';ctx.strokeRect(box.x,box.y,box.w,box.h);ctx.fillStyle='#182e33';ctx.font=`bold ${Math.min(15,w/33)}px Arial`;ctx.textAlign='center';ctx.fillText((room.shapeL||'?')+' m',w/2,20);ctx.save();ctx.translate(17,h/2);ctx.rotate(-Math.PI/2);ctx.fillText((room.shapeW||'?')+' m',0,0);ctx.restore();
 let pos=(a)=>({x:box.x+a.x*box.w,y:box.y+a.y*box.h});let color='#155e68';drawing.forEach(a=>{if(a.t==='tratta'){let p=pos(a),z=pos({x:a.x2,y:a.y2});ctx.strokeStyle='#e58b31';ctx.lineWidth=3;ctx.setLineDash([7,4]);ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(z.x,z.y);ctx.stroke();ctx.setLineDash([]);return}let p=pos(a);ctx.strokeStyle=color;ctx.lineWidth=2;ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(p.x,p.y,a.t==='tv'?13:12,0,Math.PI*2);ctx.fill();ctx.stroke();ctx.fillStyle=color;ctx.textAlign='center';ctx.textBaseline='middle';ctx.font='bold 11px Arial';let map={presa:'P',luce:'×',interruttore:'I',tv:'TV',scatola:'D',porta:'↷'};ctx.fillText(map[a.t]||'?',p.x,p.y+1);ctx.textBaseline='alphabetic'});ctx.fillStyle='#647471';ctx.font='11px Arial';ctx.textAlign='left';ctx.fillText('P presa · × luce · I comando · TV · D derivazione · ↷ porta',44,h-13);return box}
let boxDrawing=null;
function mountCanvas(){let cn=document.getElementById('floor');if(!cn)return;let i=Number(current.slice(4)),room=S.rooms[i];if(!room)return;let w=cn.clientWidth||600,h=cn.clientHeight||450,scale=window.devicePixelRatio||1;cn.width=Math.round(w*scale);cn.height=Math.round(h*scale);let ctx=cn.getContext('2d');ctx.setTransform(scale,0,0,scale,0,0);boxDrawing=drawLayout(ctx,w,h,room,room.drawing||[]);cn.onpointerdown=(ev)=>{ev.preventDefault();let rect=cn.getBoundingClientRect(),x=(ev.clientX-rect.left-boxDrawing.x)/boxDrawing.w,y=(ev.clientY-rect.top-boxDrawing.y)/boxDrawing.h;if(x<0||x>1||y<0||y>1)return;let p={x:Math.round(x*1000)/1000,y:Math.round(y*1000)/1000};if(roomTool==='gomma'){let index=-1,best=.07;room.drawing.forEach((a,j)=>{let d=Math.hypot(a.x-p.x,a.y-p.y);if(d<best){best=d;index=j}});if(index>=0)room.drawing.splice(index,1);save();mountCanvas();return}if(roomTool==='tratta'){drawingPointer=p;cn.setPointerCapture(ev.pointerId);return}room.drawing.push({t:roomTool,...p});save();mountCanvas()};cn.onpointerup=(ev)=>{if(!drawingPointer)return;let rect=cn.getBoundingClientRect(),x=(ev.clientX-rect.left-boxDrawing.x)/boxDrawing.w,y=(ev.clientY-rect.top-boxDrawing.y)/boxDrawing.h;x=Math.min(1,Math.max(0,x));y=Math.min(1,Math.max(0,y));room.drawing.push({t:'tratta',...drawingPointer,x2:Math.round(x*1000)/1000,y2:Math.round(y*1000)/1000});drawingPointer=null;save();mountCanvas()};cn.onpointercancel=()=>{drawingPointer=null}}
function render(){let all=steps();if(!all.some(a=>a.id===current))current=all[Math.min(all.length-1,2)].id;let index=all.findIndex(a=>a.id===current);let [title,subtitle]=pageInfo(current);document.getElementById('stepname').textContent=all[index].label;document.getElementById('stepcounter').textContent=(index+1)+' / '+all.length;document.getElementById('barprogress').style.width=(((index+1)/all.length)*100)+'%';document.getElementById('prev').disabled=index===0;document.getElementById('next').style.display=current==='result'?'none':'';
 let html='';if(current==='intro')html=intro();else if(current==='client')html=client();else if(current==='site')html=site();else if(current==='docs')html=docs();else if(current==='earth')html=earth();else if(current==='board')html=board();else if(current.startsWith('room'))html=room(Number(current.slice(4)));else if(current==='special')html=special();else if(current==='ev')html=ev();else if(current==='pv')html=pv();else if(current==='works')html=works();else if(current==='rates')html=rates();else html=result();document.getElementById('app').innerHTML=`<div class="eyebrow">${E(all[index].label)}</div><h1 class="page-title">${E(title)}</h1><p class="lede">${E(subtitle)}</p>`+html;document.documentElement.dataset.theme=S.theme||'light';if(current.startsWith('room'))mountCanvas();window.scrollTo({top:0,behavior:'instant'})}
function changeRooms(count){let n=Math.max(1,Math.min(20,Math.floor(count)));while(S.rooms.length<n)S.rooms.push(newRoom(S.rooms.length+1));S.rooms=S.rooms.slice(0,n);save()}
function goto(id){current=id;render()}
function nav(dir){let all=steps(),idx=all.findIndex(x=>x.id===current);goto(all[Math.max(0,Math.min(all.length-1,idx+dir))].id)}
function download(name,text,mime){let blob=new Blob([text],{type:mime}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),3000)}
function safeFilename(){return (S.practice||'rilievo-elettrico').replace(/[^a-z0-9_-]+/gi,'_').slice(0,55)}
function csv(){let t=calc(),rows=[['Rilievo elettrico dimostrativo',S.practice],['Data',S.date],['Cliente',S.customer],['Indirizzo',S.address],[],['Ambiente','Punti luce','Comandi','Prese','TV','Dati','Altri','Corrugato m','Conduttori singoli m','Metri tracce']];for(let r of t.rooms){let x=r.room;rows.push([x.name,x.light,x.switches,x.sockets,x.tv,x.data,x.special,r.conduit.toFixed(2),r.wires.toFixed(2),x.wallChase||'NON MISURATO'])}rows.push([],['Totale corrugato prima sfrido',t.conduit.toFixed(2)],['Totale corrugato con sfrido',t.conduitWaste.toFixed(2)],['Conduttori elettrici con sfrido',t.wireWaste.toFixed(2)],['Coassiale TV',t.coax.toFixed(2)],['Cavo dati',t.dataCable.toFixed(2)],['Ore uomo stimate con riserva',t.hours.toFixed(2)],[],['Dati mancanti']);t.warnings.forEach(x=>rows.push([x]));download(safeFilename()+'.csv','\ufeffsep=;\r\n'+rows.map(row=>row.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(';')).join('\r\n'),'text/csv;charset=utf-8')}
function roomImage(r){let c=document.createElement('canvas');c.width=700;c.height=520;drawLayout(c.getContext('2d'),700,520,r,r.drawing||[]);return c.toDataURL('image/png')}
function printDoc(){let t=calc(),sections=[];let kv=(pairs)=>`<table>${pairs.map(([a,b])=>`<tr><td width="40%"><b>${E(a)}</b></td><td>${E(b??'—')}</td></tr>`).join('')}</table>`;sections.push(`<h1>RILIEVO ELETTRICO GUIDATO — DEMO</h1><p>Pratica ${E(S.practice||'—')} · Data ${E(S.date||'—')} · Tecnico ${E(S.technician||'—')}</p><p><b>Rilievo preliminare per preventivazione — NON documento di conformità, progetto o rapporto di prova.</b></p><h2>1. Cliente e immobile</h2>${kv([['Cliente',S.customer],['Indirizzo',S.address+' '+S.city],['Telefono / email',(S.phone||'')+' '+(S.email||'')],['Destinazione e stato',S.kind+' · '+S.status],['Intervento',S.work],['Richieste',S.request]])}`);
 if(S.status!=='Nuova costruzione')sections.push(`<h2>2. Documenti e terra</h2>${kv([['Di.Co.',S.existingDocs.dico],['Di.Ri.',S.existingDocs.diri],['Data/impresa',S.existingDocs.dicoDate+' '+S.existingDocs.issuer],['Copertura',S.existingDocs.coverage],['Allegati',S.existingDocs.annex.join(', ')],['Modifiche',S.existingDocs.updates],['Documentazione terra',S.earth.paper],['PE',S.earth.pe],['Equipotenziali',S.earth.equip],['Prove',S.earth.test],['Note',S.earth.notes]])}`);
 sections.push(`<h2>3. Quadro e fornitura</h2>${kv([['Fornitura',S.supply.phase+' '+S.supply.kw+' kW'],['Contatore',S.supply.counter],['Quadro',S.supply.panel],['Stato quadro',S.supply.panelState],['Circuiti',S.supply.circuits],['Note',S.supply.notes]])}`);
 sections.push(`<div class="pagebreak"><p><b>STIMA PRELIMINARE — SOLO TRATTE INSERITE, POSSONO ESSERE IPOTIZZATE O INCOMPLETE. LO SCHIZZO NON GENERA AUTOMATICAMENTE METRATURE.</b></p><h2>4. Quantità e calcoli preliminari</h2>${kv([['Punti totali',t.points],['Prese / luci / comandi',`${t.sockets} / ${t.lights} / ${t.switches}`],['TV / dati',`${t.tv} / ${t.data}`],['Corrugato lordo e con sfrido',`${fmt(t.conduit)} m / ${fmt(t.conduitWaste)} m`],['Conduttori unipolari con sfrido',fmt(t.wireWaste)+' m'],['Coassiale TV',fmt(t.coax)+' m'],['Cavo dati',fmt(t.dataCable)+' m'],['Ore-uomo con riserva',fmt(t.hours)+' h'],['Squadra',t.staff+' persone'],['Ore squadra teoriche',fmt(t.crewHours)+' h'],['Costo manodopera indicativo',euro(t.cost)]])}<h2>5. Informazioni mancanti e riserve</h2>${t.warnings.map(w=>`<p class="pr-warning">${E(w)}</p>`).join('')}<p>${E(S.finalNotes)}</p><h2>6. Opere, servizi, esito</h2>${kv([['Speciali',S.special.join(', ')],['Opere',S.works.restores.join(', ')],['Vincoli',S.works.critical],['Esito',S.approval]])}</div>`);
 for(let row of t.rooms){let r=row.room;sections.push(`<div class="pr-room pagebreak"><h2>Ambiente ${row.idx+1}: ${E(r.name)}</h2>${kv([['Dimensioni',`${r.shapeL} × ${r.shapeW} × ${r.height} m`],['Quote prese / comando / derivazione',`${r.socketH} / ${r.switchH} / ${r.boxH} m`],['Punti',`Prese ${r.sockets}, luci ${r.light}, comandi ${r.switches}, TV ${r.tv}, dati ${r.data}`],['Tipo misure / posa',r.measure+' · '+r.installation],['Corrugato / conduttori',`${fmt(row.conduit)} m / ${fmt(row.wires)} m`],['Tracce murarie',r.wallChase||'Non misurate'],['Note',r.notes]])}<table><tr><th>Tratta</th><th>m</th><th>Conduttori (ipotesi)</th></tr>${row.routes.map(x=>`<tr><td>${E(x.label)}</td><td>${fmt(x.m)}</td><td>${x.conductors||'Cavo dedicato'}</td></tr>`).join('')}</table><h2>Schizzo</h2><img src="${roomImage(r)}" alt="Schizzo ambiente"></div>`)}
 document.getElementById('print-report').innerHTML=sections.join('');setTimeout(()=>window.print(),150)}
function onAction(act,el){if(act==='demo'){if(!confirm('Caricare il caso dimostrativo? Il rilievo corrente verrà sostituito.'))return;S=demo();save();goto('client')}if(act==='blank'||act==='reset'){if(!confirm('Creare un nuovo rilievo e azzerare quello attuale? Esporta prima un backup JSON se vuoi conservarlo.'))return;S=initial();save();goto('client')}if(act==='undo'||act==='clearDrawing'){let r=S.rooms[Number(el.dataset.room)];if(act==='clearDrawing'&&!confirm('Cancellare tutti gli elementi del disegno?'))return;if(act==='undo')r.drawing.pop();else r.drawing=[];save();mountCanvas()}if(act==='json')download(safeFilename()+'.json',JSON.stringify(S,null,2),'application/json;charset=utf-8');if(act==='csv')csv();if(act==='print')printDoc()}
document.getElementById('next').onclick=()=>nav(1);document.getElementById('prev').onclick=()=>nav(-1);document.getElementById('summary-btn').onclick=()=>goto('result');document.getElementById('theme-btn').onclick=()=>{S.theme=S.theme==='dark'?'light':'dark';save();render()};
document.getElementById('app').addEventListener('click',e=>{let a=e.target.closest('[data-act]');if(a){onAction(a.dataset.act,a);return}let tool=e.target.closest('[data-tool]');if(tool){roomTool=tool.dataset.tool;document.querySelectorAll('.toolbtn').forEach(x=>x.classList.toggle('active',x.dataset.tool===roomTool))}});
function collect(e){let x=e.target;if(x.id==='roomcount'){let a=num(x.value);if(a)changeRooms(a);return}let k=x.dataset.key;if(!k)return;if(x.type==='checkbox'&&x.dataset.multi==='1'){let list=get(k);if(!Array.isArray(list))list=[];if(x.checked&&!list.includes(x.value))list.push(x.value);else if(!x.checked)list=list.filter(a=>a!==x.value);set(k,list)}else if(x.type==='checkbox')set(k,x.checked);else if(x.type==='radio')set(k,x.value);else set(k,x.value);save();if(x.type==='radio'||x.type==='checkbox'||(x.tagName==='SELECT'&&['rooms','status','special'].some(a=>k.startsWith(a)))){let stepsBefore=steps();if(current==='special'||k==='status')render()}}
document.getElementById('app').addEventListener('change',collect);document.getElementById('app').addEventListener('input',e=>{let x=e.target;if(x.type==='text'||x.type==='number'||x.type==='date'||x.type==='email'||x.tagName==='TEXTAREA'){if(x.id!=='roomcount')collect(e)}});
document.getElementById('app').addEventListener('change',e=>{if(e.target.id!=='import-json')return;let file=e.target.files[0];if(!file)return;let reader=new FileReader();reader.onload=()=>{try{let parsed=JSON.parse(reader.result);if(!parsed||parsed.version!==VERSION||!Array.isArray(parsed.rooms)||parsed.rooms.length>20||parsed.rooms.length<1)throw Error('Formato o versione non riconosciuti');if(!confirm('Importare questa pratica sostituendo quella attuale?'))return;S={...initial(),...parsed};S.rooms=S.rooms.map((r,i)=>({...newRoom(i+1),...r,drawing:Array.isArray(r.drawing)?r.drawing.slice(0,500):[]}));save();goto('result')}catch(err){alert('Impossibile importare il file: '+err.message)}};reader.readAsText(file)});
window.addEventListener('resize',()=>{if(current.startsWith('room'))mountCanvas()});
render();
})();
